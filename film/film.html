<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>13 설명 영상</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--paper);overflow:hidden}
#frame{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#frame *{position:absolute}
#win{left:0;top:0;transform-origin:0 0;border-radius:14px;overflow:hidden;background:var(--void);box-shadow:0 0 0 1px var(--rule),0 30px 60px -20px rgba(0,0,0,.8)}
#chrome{left:0;top:0;width:100%;background:var(--chrome);border-bottom:1px solid #D3CABD}
#chromeUrl{background:var(--field);box-shadow:inset 0 0 0 1px #D3CABD;color:var(--field-ink);font-weight:500;white-space:nowrap;display:flex;align-items:center}
#content{left:0;overflow:hidden;background:var(--void)}
#shots{left:0;top:0;transform-origin:0 0;width:2000px;height:1125px}
#shots img{left:0;top:0;width:2000px;height:1125px;display:none}
#ring,#cursor{left:0;top:0}
#ring{border-radius:50%;border:4px solid var(--accent);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink)}
#cursor{transform-origin:4px 3px}
#bar{left:0;top:0;overflow:hidden;background:var(--field)}
#barUrl{left:0;top:0;white-space:nowrap;font-weight:500;color:var(--field-ink);display:flex;align-items:center}
#meas{left:0;top:0;white-space:nowrap;font-weight:500;visibility:hidden}
.mk{left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mk span{position:static;font-weight:700;line-height:1;white-space:nowrap;color:var(--ink)}
/* a seat: outlined while an AI sits in it, filled when a person does; red is our team, ink the other */
.mk{background:var(--paper2)}
.mk.atk{box-shadow:inset 0 0 0 4px var(--accent)}
.mk.def{box-shadow:inset 0 0 0 4px var(--ink)}
.mk.fill{background:var(--accent);box-shadow:none}
.mk.fill span{color:var(--field-ink)}
#logo{left:0;top:0;font-family:var(--f-display);font-weight:900;color:var(--ink);line-height:1;white-space:nowrap;transform:translate(-50%,-50%)}
#logoLine{left:0;top:0;background:var(--accent);border-radius:4px}
#sub{left:0;top:0;white-space:nowrap;font-weight:700;color:var(--ink);transform:translate(-50%,-50%)}
#copy,#counter,#inventory{left:0;top:0}
#copy div,#counter div,#inventory div{white-space:nowrap;left:0;top:0}
#l1{font-weight:700;color:var(--ink)}
#l2{font-weight:500;color:var(--ink2)}
#cKick,#iKick{font-weight:500;color:var(--ink2)}
#cNum,#iNum{font-family:var(--f-display);font-weight:900;color:var(--ink);line-height:1}
#cNum{text-align:right}
#cLab,#iLab,#iUnit{font-weight:700;color:var(--ink);line-height:1}
</style>
</head>
<body>
<div id="frame">
  <div id="win">
    <div id="chrome">
      <svg id="gBack" width="20" height="20" viewBox="0 0 20 20"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="#4B4F58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg id="gReload" width="20" height="20" viewBox="0 0 20 20"><path d="M15.5 10a5.5 5.5 0 1 1-1.8-4.1" fill="none" stroke="#4B4F58" stroke-width="2.2" stroke-linecap="round"/><path d="M15.8 3.6v3.6h-3.6" fill="none" stroke="#4B4F58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div id="chromeUrl"></div>
    </div>
    <div id="content">
      <div id="shots"></div>
      <div id="ring"></div>
      <svg id="cursor" viewBox="0 0 34 34"><path d="M4 3v24l6.5-6 4.4 10 4.3-1.9-4.4-9.8h8.7z" fill="#15181E" stroke="#FFFCF7" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <div id="markers"></div>
  <div id="bar"><div id="barUrl"></div></div>
  <div id="meas"></div>
  <div id="logo">13</div>
  <div id="logoLine"></div>
  <div id="sub"></div>
  <div id="copy"><div id="l1"></div><div id="l2"></div></div>
  <div id="counter"><div id="cKick"></div><div id="cNum"></div><div id="cLab"></div></div>
  <div id="inventory"><div id="iKick"></div><div id="iLab"></div><div id="iNum"></div><div id="iUnit"></div></div>
</div>
<script src="timeline.js"></script>
<script>
(() => {
"use strict";
const T = window.TIMELINE, M = T.moves;
const Q = new URLSearchParams(location.search);
const FORMAT = Q.get("format") || "16x9";
const REDUCED = Q.get("reduced") === "1";
const [IW, IH] = T.screenPx;

// Per-format composition. Same objects, same order of ideas, same times; only placement changes.
const LAYOUTS = {
  "16x9": { W: 1920, H: 1080,
    win: { x: 370, y: 64, w: 1180, ch: 52 },
    pill: { cx: 960, cy: 190, h: 96, f: 48 }, home: { cx: 960, cy: 470, h: 124, f: 60 },
    row: { atk: [310, 450, 590, 730, 870], def: [1050, 1190, 1330, 1470, 1610], atkY: 560, defY: 560, r: 62, inner: 48, chipY: 424 },
    copy: { x: 96, bottom: 984, f1: 64, f2: 56 }, counter: { k: 48, n: 104, l: 64 },
    logoTitle: { cx: 960, cy: 450, f: 280 }, sub: { cx: 960, cy: 664, f: 56 }, logo: { cx: 960, cy: 250, f: 220 }, cursor: 34, chip: 44 },
  "9x16": { W: 1080, H: 1920,
    win: { x: 40, y: 760, w: 1000, ch: 48 },
    pill: { cx: 540, cy: 720, h: 88, f: 36 }, home: { cx: 540, cy: 1010, h: 112, f: 46 },
    row: { atk: [180, 360, 540, 720, 900], def: [180, 360, 540, 720, 900], atkY: 1170, defY: 1330, r: 60, inner: 42, chipY: 1050 },
    copy: { x: 64, top: 380, f1: 64, f2: 52 }, counter: { k: 44, n: 132, l: 76 },
    logoTitle: { cx: 540, cy: 880, f: 300 }, sub: { cx: 540, cy: 1104, f: 56 }, logo: { cx: 540, cy: 760, f: 240 }, cursor: 40, chip: 40 },
  "1x1": { W: 1080, H: 1080,
    win: { x: 90, y: 44, w: 900, ch: 44 },
    pill: { cx: 540, cy: 200, h: 76, f: 32 }, home: { cx: 540, cy: 470, h: 100, f: 44 },
    row: { atk: [180, 360, 540, 720, 900], def: [180, 360, 540, 720, 900], atkY: 470, defY: 630, r: 56, inner: 40, chipY: 362 },
    copy: { x: 64, bottom: 1016, f1: 58, f2: 46 }, counter: { k: 40, n: 110, l: 62 },
    logoTitle: { cx: 540, cy: 450, f: 250 }, sub: { cx: 540, cy: 644, f: 50 }, logo: { cx: 540, cy: 250, f: 200 }, cursor: 32, chip: 36 },
};
const L = LAYOUTS[FORMAT];
const CH = L.win.ch, CW = L.win.w, CHH = CW * IH / IW;
const COVER = Math.max(L.W / CW, L.H / CHH); // the scale at which the window's content fills the frame

// ── easing and tweens ──
function bezier(x1, y1, x2, y2) {
  const bx = (u) => 3 * x1 * u * (1 - u) ** 2 + 3 * x2 * u * u * (1 - u) + u ** 3;
  const by = (u) => 3 * y1 * u * (1 - u) ** 2 + 3 * y2 * u * u * (1 - u) + u ** 3;
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; bx(m) < x ? (lo = m) : (hi = m); } return by((lo + hi) / 2); };
}
const settle = bezier(0.2, 0, 0, 1); // custom: decelerates into place, never overshoots
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, [t0, d]) => (d <= 0 ? (t >= t0 ? 1 : 0) : clamp((t - t0) / d));
// motion: eased; in the reduced cut it becomes a cut at the end of the move
const mv = (t, m) => (REDUCED ? (prog(t, m) >= 1 ? 1 : 0) : settle(prog(t, m)));
// opacity: always a short fade (allowed in the reduced cut)
const fd = (t, m) => settle(prog(t, m));
// reduced cut: an object that would have moved fades out and back in around its cut
const dip = (t, m) => { if (!REDUCED) return 1; const c = m[0] + m[1], w = Math.max(0.12, m[1] / 2); return clamp(Math.abs(t - c) / w); };
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };

// ── DOM ──
const $ = (id) => document.getElementById(id);
const frame = $("frame"), win = $("win"), shots = $("shots"), cursor = $("cursor");
frame.style.width = L.W + "px"; frame.style.height = L.H + "px";
document.body.style.width = L.W + "px"; document.body.style.height = L.H + "px";
win.style.width = CW + "px"; win.style.height = CH + CHH + "px";
$("chrome").style.height = CH + "px";
$("content").style.top = CH + "px"; $("content").style.width = CW + "px"; $("content").style.height = CHH + "px";
const gy = (CH - 20) / 2; $("gBack").style.left = "18px"; $("gBack").style.top = gy + "px"; $("gReload").style.left = "50px"; $("gReload").style.top = gy + "px";
const chromeField = { x: 84, y: 8, w: CW - 84 - 40, h: CH - 16 };
css($("chromeUrl"), { left: chromeField.x + "px", top: chromeField.y + "px", width: chromeField.w + "px", height: chromeField.h + "px", borderRadius: chromeField.h / 2 + "px", paddingLeft: chromeField.h * 0.42 + "px", fontSize: Math.round(chromeField.h * 0.5) + "px" });
$("chromeUrl").textContent = T.url;
// one <img> per screen and per clip frame; seek() shows exactly one
const imgOf = (src) => { const i = new Image(); i.src = src; i.decoding = "sync"; shots.appendChild(i); return i; };
const screenImg = Object.fromEntries(Object.entries(T.screens).map(([k, src]) => [k, imgOf(src)]));
const clipImgs = Object.fromEntries(Object.entries(T.clips).map(([k, c]) => [k, Array.from({ length: c.frames }, (_, i) => imgOf(`${c.dir}/${String(i).padStart(3, "0")}.jpg`))]));
const allImgs = [...Object.values(screenImg), ...Object.values(clipImgs).flat()];
const markers = Array.from({ length: 10 }, (_, i) => { const d = document.createElement("div"); d.className = "mk " + (i < 5 ? "atk" : "def"); d.appendChild(document.createElement("span")); $("markers").appendChild(d); return d; });
$("meas").textContent = T.url;
$("cKick").textContent = T.counter.kicker;
$("iKick").textContent = T.inventory.kicker;
$("sub").textContent = T.title.sub;
cursor.style.width = cursor.style.height = L.cursor + "px";

// ── geometry ──
function zoomAt(t) {
  let cur = { ...T.zoom[0] };
  // the reduced cut keeps the whole screen in view: no camera moves, nothing to cut between
  if (!REDUCED) for (const k of T.zoom.slice(1)) {
    if (t < k.t0) break;
    const p = mv(t, [k.t0, k.d]);
    cur = { cx: lerp(cur.cx, k.cx, p), cy: lerp(cur.cy, k.cy, p), s: Math.exp(lerp(Math.log(cur.s), Math.log(k.s), p)) };
  }
  const z = (CW / IW) * cur.s;
  return { z, ox: clamp(CW / 2 - cur.cx * z, CW - IW * z, 0), oy: clamp(CHH / 2 - cur.cy * z, CHH - IH * z, 0) };
}
const imgToContent = ([px, py], Z) => [Z.ox + px * Z.z, Z.oy + py * Z.z];
// the window: full-frame play at first, then the browser window it was in all along
function winPose(t) {
  const cover = { s: COVER, x: (L.W - CW * COVER) / 2, y: (L.H - CHH * COVER) / 2 - CH * COVER };
  const q = mv(t, M.reveal);
  const s = Math.exp(lerp(Math.log(cover.s), 0, q)), x = lerp(cover.x, L.win.x, q), y = lerp(cover.y, L.win.y, q);
  let o = t < M.winBack[0] ? 1 - fd(t, M.winHide) : fd(t, M.winBack) * (1 - fd(t, M.winOut));
  o *= dip(t, M.reveal);
  return { s, x, y, o };
}
const chromeRect = (P) => ({ cx: P.x + P.s * (chromeField.x + chromeField.w / 2), cy: P.y + P.s * (chromeField.y + chromeField.h / 2), w: chromeField.w * P.s, h: chromeField.h * P.s, f: chromeField.h * 0.5 * P.s });
const lerpRect = (a, b, p) => ({ cx: lerp(a.cx, b.cx, p), cy: lerp(a.cy, b.cy, p), w: lerp(a.w, b.w, p), h: lerp(a.h, b.h, p), f: lerp(a.f || 0, b.f || 0, p) });
const lineAlpha = (t, t0, t1) => fd(t, [t0, 0.25]) * (t1 >= T.duration ? 1 : 1 - fd(t, [t1 - 0.25, 0.25]));

function seek(t) {
  t = Math.max(0, Math.min(T.duration, t));
  const Z = zoomAt(t), P = winPose(t);

  css(win, { opacity: P.o, transform: `translate(${P.x}px,${P.y}px) scale(${P.s})` });
  css(shots, { transform: `translate(${Z.ox}px,${Z.oy}px) scale(${Z.z})` });
  // which picture: the latest shot; a clip shows the frame for the time since the shot began
  let shot = null; for (const s of T.shots) if (t >= s.t) shot = s;
  let show = null;
  if (shot && shot.src.startsWith("clip:")) { const k = shot.src.slice(5), c = T.clips[k]; show = clipImgs[k][clamp(Math.floor((t - shot.t) * c.fps + 1e-6), 0, c.frames - 1)]; }
  else if (shot) show = screenImg[shot.src];
  for (const im of allImgs) im.style.display = im === show ? "block" : "none";

  // cursor and click rings
  { const vis = fd(t, M.cursorIn) * (1 - fd(t, M.cursorOut)), start = [CW * 0.78, CHH * 0.9];
    let pos = start, press = 0, cd = 1;
    T.clicks.forEach((c, k) => {
      const from = k === 0 ? start : imgToContent(T.clicks[k - 1].at, Z), to = imgToContent(c.at, Z), m = [c.t - 0.6, 0.4];
      if (t >= m[0]) pos = [lerp(from[0], to[0], mv(t, m)), lerp(from[1], to[1], mv(t, m))];
      const d = t - c.t; if (d > -0.06 && d < 0.16) press = Math.max(press, 1 - Math.abs(d - 0.03) / 0.12);
      cd *= dip(t, m);
    });
    css(cursor, { opacity: vis * cd, transform: `translate(${pos[0] - 4}px,${pos[1] - 3}px) scale(${1 - 0.14 * clamp(press)})` });
    const c = T.clicks.find((k) => t >= k.t && t < k.t + T.ring);
    if (c) { const p = prog(t, [c.t, T.ring]), [x, y] = imgToContent(c.at, Z), r = REDUCED ? 40 : lerp(14, 54, settle(p));
      css($("ring"), { opacity: 0.9 * (1 - p), width: 2 * r + "px", height: 2 * r + "px", transform: `translate(${x - r}px,${y - r}px)` }); }
    else $("ring").style.opacity = 0;
  }

  // the address, one object all the way: lifted out of the window's chrome as a pill for the turn,
  // shrunk to a chip above our five seats (the link, handed over), then grown into the sign-off
  const r = L.row;
  { let R, o = 0;
    const chipPose = { cx: (r.atk[0] + r.atk[4]) / 2, cy: r.chipY, h: L.chip * 1.9, f: L.chip };
    const rect = (p) => { $("meas").style.fontSize = p.f + "px"; return { cx: p.cx, cy: p.cy, h: p.h, f: p.f, w: $("meas").getBoundingClientRect().width + p.h * 0.84 }; };
    if (t >= M.barToPill[0] && t < M.chip[0]) { R = lerpRect(chromeRect(winPose(M.barToPill[0] - 0.01)), rect(L.pill), mv(t, M.barToPill)); o = dip(t, M.barToPill); }
    else if (t >= M.chip[0] && t < M.barHome[0]) { R = lerpRect(rect(L.pill), rect(chipPose), mv(t, M.chip)); o = dip(t, M.chip); }
    else if (t >= M.barHome[0]) { R = lerpRect(rect(chipPose), rect(L.home), mv(t, M.barHome)); o = dip(t, M.barHome); }
    if (R) {
      css($("bar"), { opacity: o, width: R.w + "px", height: R.h + "px", borderRadius: R.h / 2 + "px", transform: `translate(${R.cx - R.w / 2}px,${R.cy - R.h / 2}px)`, boxShadow: `inset 0 0 0 ${Math.max(1, 2 * R.h / 72)}px #D3CABD` });
      css($("barUrl"), { height: R.h + "px", paddingLeft: R.h * 0.42 + "px", fontSize: R.f + "px" });
      $("barUrl").textContent = T.url;
    } else $("bar").style.opacity = 0;
  }

  // the ten seats: who fills them. A person's seat is filled, an AI's is an outline, so the turn
  // (four outlines filling in) shows without reading the labels.
  for (let i = 0; i < 10; i++) {
    const el = markers[i], atk = i < 5, k = atk ? i : i - 5;
    const x = atk ? r.atk[k] : r.def[k], y = atk ? r.atkY : r.defY, mIn = [M.seatsIn[0] + 0.05 * k + (atk ? 0 : 0.25), M.seatsIn[1]];
    const q = mv(t, mIn), o = fd(t, mIn) * dip(t, mIn) * (1 - fd(t, M.clear));
    let label = T.soloNames[i], sx = 1, la = fd(t, M.labelsIn), filled = i === 0;
    if (atk && i > 0) { const f = prog(t, [M.flips[0] + (i - 1) * M.flips[1], M.flips[1]]);
      if (f >= 0.5) { label = T.friendName; filled = true; }
      if (REDUCED) la *= f > 0 && f < 1 ? Math.abs(f - 0.5) * 2 : 1; else sx = Math.abs(Math.cos(f * Math.PI)); }
    el.className = `mk ${atk ? "atk" : "def"}${filled ? " fill" : ""}`;
    const span = el.firstChild; span.textContent = t >= M.labelsIn[0] ? label : ""; span.style.opacity = la; span.style.fontSize = r.inner + "px";
    css(el, { opacity: o, width: 2 * r.r + "px", height: 2 * r.r + "px", transform: `translate(${x - r.r}px,${y - r.r + 28 * (1 - q)}px) scaleX(${sx})` });
  }

  // the 13 mark: a title card after the reveal, and over the address at the end
  { const tt = T.title, inTitle = t >= tt.t0 && t < M.winBack[0];
    const pose = inTitle ? L.logoTitle : L.logo, m = inTitle ? M.titleIn : M.logoIn;
    const q = mv(t, m), o = (inTitle ? fd(t, M.titleIn) * (1 - fd(t, M.titleOut)) : (t >= M.logoIn[0] ? fd(t, M.logoIn) : 0)) * dip(t, m);
    css($("logo"), { opacity: o, fontSize: pose.f + "px", left: pose.cx + "px", top: pose.cy + 18 * (1 - q) + "px" });
    const lw = pose.f * 0.7, lh = Math.round(pose.f * 0.04);
    css($("logoLine"), { opacity: o, width: lw * (REDUCED ? 1 : q) + "px", height: lh + "px", transform: `translate(${pose.cx - lw / 2}px,${pose.cy + pose.f * 0.52}px)` });
    css($("sub"), { opacity: inTitle ? o * fd(t, [tt.t0 + 0.25, 0.25]) : 0, fontSize: L.sub.f + "px", left: L.sub.cx + "px", top: L.sub.cy + "px" }); }

  // copy (= burned-in captions), the click counter and the inventory, in the caption zone
  { const c = T.copy.find((x) => t >= x.t0 && t < x.t1), cp = L.copy, atTop = cp.top != null;
    const h1 = cp.f1 * 1.25, h2 = cp.f2 * 1.4, y1 = atTop ? cp.top : cp.bottom - h1 - h2, y2 = y1 + h1;
    const l1 = $("l1"), l2 = $("l2"), rise = (t0) => (REDUCED ? 0 : 14 * (1 - fd(t, [t0, 0.25])));
    if (c) {
      css(l1, { opacity: lineAlpha(t, c.t0, c.t1), fontSize: cp.f1 + "px", lineHeight: h1 + "px", transform: `translate(${cp.x}px,${y1 + rise(c.t0)}px)` });
      css(l2, { opacity: c.l2 ? lineAlpha(t, c.l2at, c.t1) : 0, fontSize: cp.f2 + "px", lineHeight: h2 + "px", transform: `translate(${cp.x}px,${y2 + rise(c.l2at)}px)` });
      l1.textContent = c.l1; l2.textContent = c.l2;
    } else { l1.style.opacity = 0; l2.style.opacity = 0; }
    // the counter names the button on screen; the numeral ticks on the click
    const K = L.counter, ca = lineAlpha(t, T.counter.t0, T.counter.t1), k = T.clicks.filter((x) => t >= x.show).pop();
    const kh = K.k * 1.4, ky = atTop ? cp.top : cp.bottom - kh - K.n, ny = ky + kh, box = K.n * 0.86;
    const ticked = k && t >= k.t, tick = ticked ? fd(t, [k.t, 0.2]) : 0;
    css($("cKick"), { opacity: ca, fontSize: K.k + "px", lineHeight: kh + "px", transform: `translate(${cp.x}px,${ky}px)` });
    css($("cNum"), { opacity: ca * (k ? lerp(0.28, 1, tick) : 0), fontSize: K.n + "px", width: box + "px", transform: `translate(${cp.x}px,${ny + (ticked && !REDUCED ? 10 * (1 - tick) : 0)}px)` });
    css($("cLab"), { opacity: ca * (k ? fd(t, [k.show, 0.2]) : 0), fontSize: K.l + "px", transform: `translate(${cp.x + box + K.l * 0.35}px,${ny + (K.n - K.l) * 0.62}px)` });
    $("cNum").textContent = k ? String(k.n) : ""; $("cLab").textContent = k ? k.label : "";
    // what is inside: the game's own counts, one per beat
    const I = T.inventory, ia = lineAlpha(t, I.t0, I.t1), it = I.items.filter((x) => t >= x.show).pop();
    const iRise = it && !REDUCED ? 10 * (1 - fd(t, [it.show, 0.2])) : 0, iA = it ? ia * fd(t, [it.show, 0.2]) : 0;
    $("iLab").textContent = it ? it.label : ""; $("iNum").textContent = it ? String(it.n) : ""; $("iUnit").textContent = it ? it.unit : "";
    css($("iKick"), { opacity: ia, fontSize: K.k + "px", lineHeight: kh + "px", transform: `translate(${cp.x}px,${ky}px)` });
    css($("iLab"), { opacity: iA, fontSize: K.l + "px", transform: `translate(${cp.x}px,${ny + (K.n - K.l) * 0.62}px)` });
    const lw = $("iLab").getBoundingClientRect().width;
