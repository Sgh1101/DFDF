<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>13 설명 영상</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--paper);overflow:hidden}
#frame{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#frame *{position:absolute}
#win{left:0;top:0;transform-origin:0 0;border-radius:14px;overflow:hidden;background:var(--void);box-shadow:0 0 0 1px var(--rule),0 24px 48px -18px rgba(21,24,30,.35)}
#chrome{left:0;top:0;width:100%;background:#FBF8F2;border-bottom:1px solid var(--rule)}
#content{left:0;overflow:hidden;background:var(--void)}
#shots{left:0;top:0;transform-origin:0 0;width:2000px;height:1125px}
#shots img{left:0;top:0;width:2000px;height:1125px;display:block}
#ring,#cursor{left:0;top:0}
#ring{border-radius:50%;border:4px solid var(--accent);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink)}
#cursor{transform-origin:4px 3px}
#bar{left:0;top:0;overflow:hidden}
#barFill{left:0;bottom:0;background:var(--accent-ink)}
#barUrl{left:0;top:0;white-space:nowrap;font-weight:500;color:var(--ink);display:flex;align-items:center}
#barLabel{left:0;top:0;white-space:nowrap;font-weight:500;color:var(--ink2)}
.mk{left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mk span{position:static;font-weight:700;color:var(--ink);line-height:1;white-space:nowrap}
.mk.atk{background:var(--accent)}
.mk.def{background:var(--paper);box-shadow:inset 0 0 0 4px var(--ink)}
#chip{left:0;top:0;white-space:nowrap;font-weight:500;color:var(--ink);background:var(--field);border-radius:999px;display:flex;align-items:center;justify-content:center}
#logo{left:0;top:0;font-family:var(--f-display);font-weight:900;color:var(--ink);line-height:1;white-space:nowrap;transform:translate(-50%,-50%)}
#logoLine{left:0;top:0;background:var(--accent);border-radius:4px}
#copy,#counter{left:0;top:0}
#copy div,#counter div{white-space:nowrap;left:0;top:0}
#l1{font-weight:700;color:var(--ink)}
#l2{font-weight:500;color:var(--ink2)}
#cKick{font-weight:500;color:var(--ink2)}
#cNum{font-family:var(--f-display);font-weight:900;color:var(--ink);line-height:1;text-align:right}
#cLab{font-weight:700;color:var(--ink);line-height:1}
#mosaic{left:0;top:0}
#mosaic img{object-fit:cover;border-radius:4px}
#inventory{left:0;top:0}
#inventory div{white-space:nowrap;left:0;top:0}
#iKick{font-weight:500;color:var(--ink2)}
#iLab,#iUnit{font-weight:700;color:var(--ink);line-height:1}
#iNum{font-family:var(--f-display);font-weight:900;color:var(--ink);line-height:1}
</style>
</head>
<body>
<div id="frame">
  <div id="win">
    <div id="chrome">
      <svg id="gBack" width="20" height="20" viewBox="0 0 20 20"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="#4B4F58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg id="gReload" width="20" height="20" viewBox="0 0 20 20"><path d="M15.5 10a5.5 5.5 0 1 1-1.8-4.1" fill="none" stroke="#4B4F58" stroke-width="2.2" stroke-linecap="round"/><path d="M15.8 3.6v3.6h-3.6" fill="none" stroke="#4B4F58" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div id="content">
      <div id="shots"></div>
      <div id="mosaic"></div>
      <div id="ring"></div>
      <svg id="cursor" viewBox="0 0 34 34"><path d="M4 3v24l6.5-6 4.4 10 4.3-1.9-4.4-9.8h8.7z" fill="#15181E" stroke="#FFFCF7" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <div id="markers"></div>
  <div id="barLabel"></div>
  <div id="bar"><div id="barFill"></div><div id="barUrl"></div></div>
  <div id="chip"></div>
  <div id="logo">13</div>
  <div id="logoLine"></div>
  <div id="copy"><div id="l1"></div><div id="l2"></div></div>
  <div id="counter"><div id="cKick"></div><div id="cNum"></div><div id="cLab"></div></div>
  <div id="inventory"><div id="iKick"></div><div id="iLab"></div><div id="iNum"></div><div id="iUnit"></div></div>
</div>
<script src="timeline.js"></script>
<script>
(() => {
"use strict";
const T = window.TIMELINE, M = T.moves;
const Q = new URLSearchParams(location.search);
const FORMAT = Q.get("format") || "16x9";
const REDUCED = Q.get("reduced") === "1";
const [IW, IH] = T.screenPx;

// Per-format composition. Same objects, same order of ideas, same times; only placement changes.
const LAYOUTS = {
  "16x9": { W: 1920, H: 1080,
    win: { x: 370, y: 64, w: 1180, ch: 52 },
    bar0: { cx: 960, cy: 470, w: 720, h: 14 }, barLabel: 30,
    field: { cx: 960, cy: 470, w: 900, h: 96, f: 48 }, pill: { cx: 960, cy: 190, w: 900, h: 96, f: 48 }, home: { cx: 960, cy: 470, w: 1100, h: 124, f: 60 },
    row: { atk: [330, 462, 594, 726, 858], def: [1062, 1194, 1326, 1458, 1590], atkY: 560, defY: 560, r: 58, inner: 44, chipY: 424 },
    strip: { cy: 930, x: [1352, 1392, 1432, 1472, 1512, 1600, 1640, 1680, 1720, 1760], r: 14 },
    copy: { x: 96, bottom: 984, f1: 64, f2: 56 }, counter: { k: 44, n: 104, l: 64 },
    logo: { cx: 960, cy: 250, f: 220 }, cursor: 34, chip: 44 },
  "9x16": { W: 1080, H: 1920,
    win: { x: 40, y: 760, w: 1000, ch: 48 },
    bar0: { cx: 540, cy: 1010, w: 820, h: 16 }, barLabel: 40,
    field: { cx: 540, cy: 1010, w: 920, h: 88, f: 36 }, pill: { cx: 540, cy: 720, w: 920, h: 88, f: 36 }, home: { cx: 540, cy: 1010, w: 960, h: 112, f: 46 },
    row: { atk: [180, 360, 540, 720, 900], def: [180, 360, 540, 720, 900], atkY: 1170, defY: 1330, r: 56, inner: 38, chipY: 1050 },
    strip: { cy: 1470, x: [290, 334, 378, 422, 466, 614, 658, 702, 746, 790], r: 16 },
    copy: { x: 64, top: 380, f1: 64, f2: 52 }, counter: { k: 44, n: 132, l: 76 },
    logo: { cx: 540, cy: 760, f: 240 }, cursor: 40, chip: 40 },
  "1x1": { W: 1080, H: 1080,
    win: { x: 90, y: 44, w: 900, ch: 44 },
    bar0: { cx: 540, cy: 470, w: 720, h: 14 }, barLabel: 30,
    field: { cx: 540, cy: 470, w: 820, h: 76, f: 32 }, pill: { cx: 540, cy: 200, w: 820, h: 76, f: 32 }, home: { cx: 540, cy: 470, w: 900, h: 100, f: 44 },
    row: { atk: [180, 360, 540, 720, 900], def: [180, 360, 540, 720, 900], atkY: 470, defY: 630, r: 52, inner: 36, chipY: 362 },
    strip: { cy: 720, x: [300, 340, 380, 420, 460, 620, 660, 700, 740, 780], r: 15 },
    copy: { x: 64, bottom: 1016, f1: 58, f2: 46 }, counter: { k: 36, n: 110, l: 62 },
    logo: { cx: 540, cy: 250, f: 200 }, cursor: 32, chip: 36 },
};
const L = LAYOUTS[FORMAT];
const CH = L.win.ch, CW = L.win.w, CHH = CW * IH / IW;

// ── easing and tweens ──
function bezier(x1, y1, x2, y2) {
  const bx = (u) => 3 * x1 * u * (1 - u) ** 2 + 3 * x2 * u * u * (1 - u) + u ** 3;
  const by = (u) => 3 * y1 * u * (1 - u) ** 2 + 3 * y2 * u * u * (1 - u) + u ** 3;
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; bx(m) < x ? (lo = m) : (hi = m); } return by((lo + hi) / 2); };
}
const settle = bezier(0.2, 0, 0, 1); // custom: decelerates into place, never overshoots
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, [t0, d]) => (d <= 0 ? (t >= t0 ? 1 : 0) : clamp((t - t0) / d));
// motion: eased; in the reduced cut it becomes a cut at the end of the move
const mv = (t, m) => (REDUCED ? (prog(t, m) >= 1 ? 1 : 0) : settle(prog(t, m)));
// opacity: always a short fade (allowed in the reduced cut)
const fd = (t, m) => settle(prog(t, m));
// reduced cut: an object that would have moved fades out and back in around its cut
const dip = (t, m) => { if (!REDUCED) return 1; const c = m[0] + m[1], w = Math.max(0.12, m[1] / 2); return clamp(Math.abs(t - c) / w); };
const mixHex = (a, b, p) => { const A = a.match(/\w\w/g).map((h) => parseInt(h, 16)), B = b.match(/\w\w/g).map((h) => parseInt(h, 16)); return "rgb(" + A.map((v, i) => Math.round(lerp(v, B[i], p))).join(",") + ")"; };
const C = Object.fromEntries(["paper2", "rule", "field", "accent"].map((k) => [k, getComputedStyle(document.documentElement).getPropertyValue("--" + k).trim().replace("#", "")]));

// ── DOM ──
const $ = (id) => document.getElementById(id);
const frame = $("frame"), win = $("win"), shots = $("shots"), cursor = $("cursor");
frame.style.width = L.W + "px"; frame.style.height = L.H + "px";
document.body.style.width = L.W + "px"; document.body.style.height = L.H + "px";
win.style.width = CW + "px"; win.style.height = CH + CHH + "px";
$("chrome").style.height = CH + "px";
$("content").style.top = CH + "px"; $("content").style.width = CW + "px"; $("content").style.height = CHH + "px";
const gy = (CH - 20) / 2; $("gBack").style.left = "18px"; $("gBack").style.top = gy + "px"; $("gReload").style.left = "50px"; $("gReload").style.top = gy + "px";
const imgs = T.shots.map((s) => { const i = new Image(); if (s.src !== "mosaic") { i.src = T.screens[s.src]; i.decoding = "sync"; shots.appendChild(i); } return i; });
const MZ = T.mosaic, tw = (CW - 2 * MZ.gap) / 3, th = (CHH - MZ.gap) / 2;
const tiles = MZ.maps.map((m, i) => { const im = new Image(); im.src = m.src; im.decoding = "sync"; im.alt = m.name; $("mosaic").appendChild(im);
  Object.assign(im.style, { width: tw + "px", height: th + "px", left: (i % 3) * (tw + MZ.gap) + "px", top: Math.floor(i / 3) * (th + MZ.gap) + "px" }); return im; });
$("iKick").textContent = T.inventory.kicker;
const markers = Array.from({ length: 10 }, (_, i) => { const d = document.createElement("div"); d.className = "mk " + (i < 5 ? "atk" : "def"); d.appendChild(document.createElement("span")); $("markers").appendChild(d); return d; });
$("barLabel").textContent = T.barLabel.text;
$("chip").textContent = T.url;
$("cKick").textContent = T.counter.kicker;
cursor.style.width = cursor.style.height = L.cursor + "px";
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };

// ── geometry ──
function zoomAt(t) {
  let cur = { ...T.zoom[0] };
  // the reduced cut keeps the whole screen in view: no camera moves, nothing to cut between
  if (!REDUCED) for (const k of T.zoom.slice(1)) {
    if (t < k.t0) break;
    const p = mv(t, [k.t0, k.d]);
    cur = { cx: lerp(cur.cx, k.cx, p), cy: lerp(cur.cy, k.cy, p), s: Math.exp(lerp(Math.log(cur.s), Math.log(k.s), p)) };
  }
  const z = (CW / IW) * cur.s;
  return { z, ox: clamp(CW / 2 - cur.cx * z, CW - IW * z, 0), oy: clamp(CHH / 2 - cur.cy * z, CHH - IH * z, 0) };
}
// image px -> content-local px -> frame px (the window never scales, it only fades)
const imgToContent = ([px, py], Z) => [Z.ox + px * Z.z, Z.oy + py * Z.z];
const contentToFrame = ([x, y]) => [L.win.x + x, L.win.y + CH + y];
function winAlpha(t) {
  const open = fd(t, [M.winOpen[0], 0.25]) * dip(t, M.winOpen);
  return t < M.winBack[0] ? open * (1 - fd(t, M.winHide)) : fd(t, M.winBack) * (1 - fd(t, M.winOut));
}
const chromeRect = () => { const w = CW - 84 - 40; return { cx: L.win.x + 84 + w / 2, cy: L.win.y + CH / 2, w, h: CH - 16, f: 15 }; };
const lerpRect = (a, b, p) => ({ cx: lerp(a.cx, b.cx, p), cy: lerp(a.cy, b.cy, p), w: lerp(a.w, b.w, p), h: lerp(a.h, b.h, p), f: lerp(a.f || 0, b.f || 0, p) });
function crawl(t) { let v = 0, prev = 0; for (const [tc, f] of T.crawl) { v = lerp(prev, f, mv(t, [tc, 0.25])); if (t < tc + 0.25) break; prev = f; } return v; }
// lines that run to the end hold on the last frame
const lineAlpha = (t, t0, t1) => fd(t, [t0, 0.25]) * (t1 >= T.duration ? 1 : 1 - fd(t, [t1 - 0.25, 0.25]));
const hudPos = (i, t) => { const Z = zoomAt(t), [x, y] = contentToFrame(imgToContent(T.hudFaces[i], Z)); return { x, y, r: (T.hudFaceSize / 2) * Z.z }; };

function seek(t) {
  t = Math.max(0, Math.min(T.duration, t));
  const Z = zoomAt(t), wa = winAlpha(t);

  // the window: opens under the address bar, steps aside for the model, carries the proof
  css(win, { opacity: wa, transform: `translate(${L.win.x}px,${L.win.y}px)`, clipPath: `inset(0 0 ${(1 - mv(t, M.winOpen)) * (CHH + CH - 2)}px 0 round 14px)` });
  css(shots, { transform: `translate(${Z.ox}px,${Z.oy}px) scale(${Z.z})` });
  let top = -1; T.shots.forEach((s, i) => { if (t >= s.t) top = i; });
  imgs.forEach((im, i) => { im.style.display = i === top && T.shots[i].src !== "mosaic" ? "block" : "none"; });
  // the map tiles arrive one after another, then hold
  { const on = top >= 0 && T.shots[top].src === "mosaic", t0 = on ? T.shots[top].t : 0;
    $("mosaic").style.display = on ? "block" : "none";
    tiles.forEach((im, i) => { const m = [t0 + i * MZ.stagger, MZ.fade]; css(im, { opacity: on ? fd(t, m) : 0, transform: `scale(${REDUCED ? 1 : lerp(0.96, 1, mv(t, m))})` }); }); }

  // cursor and click rings
  { const vis = fd(t, M.cursorIn) * (1 - fd(t, M.cursorOut));
    const start = [CW * 0.78, CHH * 0.9];
    let pos = start, press = 0, cd = 1;
    T.clicks.forEach((c, k) => {
      const from = k === 0 ? start : imgToContent(T.clicks[k - 1].at, Z), to = imgToContent(c.at, Z), m = [c.t - 0.75, 0.5];
      if (t >= m[0]) pos = [lerp(from[0], to[0], mv(t, m)), lerp(from[1], to[1], mv(t, m))];
      const d = t - c.t; if (d > -0.06 && d < 0.16) press = Math.max(press, 1 - Math.abs(d - 0.03) / 0.12);
      cd *= dip(t, m);
    });
    css(cursor, { opacity: vis * cd, transform: `translate(${pos[0] - 4}px,${pos[1] - 3}px) scale(${1 - 0.14 * clamp(press)})` });
    const c = T.clicks.find((k) => t >= k.t && t < k.t + T.ring);
    if (c) {
      const p = prog(t, [c.t, T.ring]), [x, y] = imgToContent(c.at, Z), r = REDUCED ? 40 : lerp(14, 54, settle(p));
      css($("ring"), { opacity: 0.9 * (1 - p), width: 2 * r + "px", height: 2 * r + "px", transform: `translate(${x - r}px,${y - r}px)` });
    } else $("ring").style.opacity = 0;
  }

  // the bar: download bar -> address field -> the window's address bar -> pill -> home
  { const progress = { ...L.bar0, f: L.field.f };
    let R, o = fd(t, M.barIn);
    if (t < M.winOpen[0]) { R = lerpRect(progress, L.field, mv(t, M.barToField)); o *= dip(t, M.barToField); }
    else if (t < M.barToPill[0]) { R = lerpRect(L.field, chromeRect(), mv(t, M.winOpen)); o *= t < M.winHide[0] ? dip(t, M.winOpen) : (t < M.winOut[0] ? wa : 1); }
    else if (t < M.barHome[0]) { R = lerpRect(chromeRect(), L.pill, mv(t, M.barToPill)); o *= dip(t, M.barToPill); }
    else { R = lerpRect(L.pill, L.home, mv(t, M.barHome)); o *= dip(t, M.barHome); }
    const field = mv(t, M.barToField);
    const enter = t >= M.enter[0] ? 1 - prog(t, M.enter) : 0;
    const fillV = t < M.fillHome[0] ? crawl(t) * (1 - prog(t, M.fillRetract)) : (REDUCED ? fd(t, M.fillHome) : mv(t, M.fillHome));
    const fillH = lerp(R.h, Math.max(4, R.h * 0.085), field);
    const sx = REDUCED ? 1 : lerp(0.6, 1, mv(t, M.barIn));
    css($("bar"), { opacity: o, width: R.w + "px", height: R.h + "px", borderRadius: R.h / 2 + "px", transform: `translate(${R.cx - R.w / 2}px,${R.cy - R.h / 2}px) scaleX(${sx})`,
      background: mixHex(C.paper2, C.field, field), boxShadow: `inset 0 0 0 ${Math.max(1, 2 * R.h / 72) * field}px ${mixHex(C.rule, C.accent, enter)}` });
    css($("barFill"), { width: R.w * fillV + "px", height: fillH + "px" });
    const n = Math.floor(T.url.length * prog(t, M.type) + 1e-6);
    css($("barUrl"), { height: R.h + "px", paddingLeft: R.h * 0.42 + "px", fontSize: R.f + "px", opacity: field });
    $("barUrl").textContent = T.url.slice(0, n);
    const b = L.bar0, lb = T.barLabel;
    css($("barLabel"), { opacity: lineAlpha(t, lb.t0, lb.t1), fontSize: L.barLabel + "px", transform: `translate(${b.cx - b.w / 2}px,${b.cy - b.h / 2 - L.barLabel * 1.9}px)` });
  }

  // the ten seats: a row (model) -> the HUD (proof) -> who fills them (turn)
  const r = L.row;
  for (let i = 0; i < 10; i++) {
    const el = markers[i], atk = i < 5, k = atk ? i : i - 5;
    const rowP = { x: atk ? r.atk[k] : r.def[k], y: atk ? r.atkY : r.defY, r: r.r }, stripP = { x: L.strip.x[i], y: L.strip.cy, r: L.strip.r };
    const mIn = [(atk ? M.atkIn[0] : M.defIn[0]) + 0.05 * k, M.atkIn[1]], mHud = [M.toHud[0] + 0.02 * i, M.toHud[1]];
    let p, o;
    if (t < M.stripIn[0]) { const q = mv(t, mIn); p = { x: rowP.x, y: rowP.y + 28 * (1 - q), r: rowP.r }; o = fd(t, mIn) * (1 - fd(t, M.rowOut)) * dip(t, mIn); }
    else if (t < M.backToRow[0]) { const h = hudPos(i, t), q = mv(t, mHud); p = { x: lerp(stripP.x, h.x, q), y: lerp(stripP.y, h.y, q), r: lerp(stripP.r, h.r, q) }; o = fd(t, M.stripIn) * (1 - fd(t, REDUCED ? M.hudFadeReduced : M.hudFade)) * dip(t, mHud); }
    else { const mB = [M.backToRow[0] + 0.05 * k + (atk ? 0 : 0.25), M.backToRow[1]], q = mv(t, mB); p = { x: rowP.x, y: rowP.y + 28 * (1 - q), r: rowP.r }; o = fd(t, mB) * dip(t, mB) * (1 - fd(t, M.clear)); }
    // who fills the seat: four teammates flip from AI to 친구
    let label = T.soloNames[i], sx = 1, la = fd(t, M.labelsIn);
    if (atk && i > 0) { const q = prog(t, [M.flips[0] + (i - 1) * M.flips[1], M.flips[1]]);
      if (q >= 0.5) label = T.friendName;
      if (REDUCED) la *= q > 0 && q < 1 ? Math.abs(q - 0.5) * 2 : 1; else sx = Math.abs(Math.cos(q * Math.PI)); }
    const span = el.firstChild; span.textContent = t >= M.labelsIn[0] ? label : ""; span.style.opacity = la; span.style.fontSize = r.inner * (p.r / r.r) + "px";
    css(el, { opacity: o, width: 2 * p.r + "px", height: 2 * p.r + "px", transform: `translate(${p.x - p.r}px,${p.y - p.r}px) scaleX(${sx})` });
  }

  // the same link, peeled off the address pill and handed to the team
  { const f = L.chip, h = f * 1.9, w = f * 0.56 * T.url.length + f * 1.6, q = mv(t, M.chip);
    const x = lerp(L.pill.cx, (r.atk[0] + r.atk[4]) / 2, q), y = lerp(L.pill.cy, r.chipY, q);
    css($("chip"), { opacity: (t >= M.chip[0] ? fd(t, [M.chip[0], 0.15]) : 0) * (1 - fd(t, M.clear)) * dip(t, M.chip), fontSize: f + "px", width: w + "px", height: h + "px", borderRadius: h / 2 + "px",
      boxShadow: `inset 0 0 0 2px #${C.rule}`, transform: `translate(${x - w / 2}px,${y - h / 2}px)` }); }

  // the 13 mark
  { const q = mv(t, M.logoIn), o = fd(t, M.logoIn) * dip(t, M.logoIn);
    css($("logo"), { opacity: o, fontSize: L.logo.f + "px", left: L.logo.cx + "px", top: L.logo.cy + 18 * (1 - q) + "px" });
    const lw = L.logo.f * 0.7, lh = Math.round(L.logo.f * 0.04);
    css($("logoLine"), { opacity: o, width: lw * (REDUCED ? 1 : q) + "px", height: lh + "px", transform: `translate(${L.logo.cx - lw / 2}px,${L.logo.cy + L.logo.f * 0.52}px)` }); }
