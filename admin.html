<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>13 운영</title>
<style>
:root{--bg:#0a0d12;--panel:#131923;--panel2:#1a2230;--line:#273244;--ink:#e8edf4;--steel:#8a97ab;--dim:#5b6879;--gold:#ffc849;--red:#ff4d5e;--green:#4ade80;--blue:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans KR",system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 12px}
button:hover{border-color:var(--steel)}
button.go{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
button.bad{border-color:#5c2630;color:#ff9aa5}
input,select,textarea{background:#0d121a;border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
.login{max-width:340px;margin:16vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:center}
.login h1{font-size:20px;margin-bottom:6px}.login p{color:var(--steel);font-size:12px;margin-bottom:16px}
.login input{width:100%;margin-bottom:10px;text-align:center;font-size:16px}
.login button{width:100%}
.err{color:#ff8a95;font-size:12px;min-height:18px;margin-top:6px}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,13,18,.94);backdrop-filter:blur(6px);z-index:5;flex-wrap:wrap}
header b{font-size:16px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button.on{border-color:var(--gold);color:var(--gold)}
header .sp{flex:1}
main{padding:18px;max-width:1200px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card .n{font-size:28px;font-weight:800}.card .l{color:var(--steel);font-size:12px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{color:var(--steel);font-weight:600;background:var(--panel2)}
td .acts{display:flex;gap:4px;flex-wrap:wrap}
td .acts button{padding:3px 8px;font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--steel)}
.tag.red{color:#ff9aa5;border-color:#5c2630}.tag.gold{color:var(--gold);border-color:#5c4b1f}.tag.green{color:var(--green);border-color:#1f5c36}.tag.blue{color:var(--blue);border-color:#1d4a63}
button.gold{border-color:#5c4b1f;color:var(--gold)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:17px}
.modal .row{display:flex;align-items:center;gap:8px}
.modal .row.big{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.modal .row.end{margin-top:4px}
.modal .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 14px}
.modal .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 14px}
.modal .grid3 label{display:flex;flex-direction:column;gap:4px;font-weight:600}
.modal .grid3 .muted{font-weight:400;font-size:11.5px}
.muted{color:var(--dim);font-size:12px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h3{font-size:15px;margin-bottom:4px}.sec .d{color:var(--steel);font-size:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#0f141d}
.f label{font-size:13px}.f small{display:block;color:var(--dim);font-size:11px}
.f input[type=number]{width:96px;text-align:right}.f input[type=text]{width:100%}
.f.wide{grid-column:1/-1;flex-direction:column;align-items:stretch}
.save{position:sticky;bottom:0;padding:12px 0;background:linear-gradient(transparent,var(--bg) 40%);display:flex;gap:8px;justify-content:flex-end}
.room{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.room h4{font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pl span{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;background:#0f141d;border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px;font-size:12px}
.pl span button{padding:1px 6px;font-size:11px;border-radius:99px}
.log{font-family:ui-monospace,monospace;font-size:12px}
.log td:first-child{white-space:nowrap;color:var(--dim)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:8px 16px;border-radius:10px;display:none;z-index:9}
.modal .sheet.wide{width:min(1180px,100%)}
.sk-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sk-tools button{padding:4px 10px;font-size:12px}
.sk-tools .sp{flex:1}
.sk-wrap{overflow:auto;max-height:58vh;border:1px solid var(--line);border-radius:10px;background:#0d121a}
table.sk{border:0;border-radius:0;width:auto;border-collapse:separate;border-spacing:0;background:transparent;overflow:visible}
table.sk th,table.sk td{padding:0;border-bottom:1px solid #1c2533;border-right:1px solid #1c2533;vertical-align:middle}
table.sk th{position:sticky;background:var(--panel2);font-size:11.5px;white-space:nowrap;cursor:pointer;user-select:none;color:var(--ink)}
table.sk tr:first-child th{top:0;z-index:2;padding:8px 3px;writing-mode:vertical-rl;height:92px;text-align:left;font-weight:700}
table.sk th[data-row]{left:0;z-index:1;padding:4px 10px;text-align:left;font-weight:600}
table.sk tr:first-child th.corner{left:0;top:0;z-index:3;writing-mode:horizontal-tb;cursor:default;color:var(--dim);font-weight:400;padding:6px 10px}
table.sk th:hover{color:var(--gold)}
table.sk td{width:30px;min-width:30px;height:27px;cursor:pointer;text-align:center;font-size:12px;font-weight:800;line-height:27px}
table.sk td.own{background:color-mix(in srgb,var(--c) 72%,transparent)}
table.sk td.own::after{content:"✓";color:#0b0f16}
table.sk td.sel{box-shadow:inset 0 0 0 2px #fff;background-color:rgba(255,255,255,.16)}
table.sk td.own.sel{background:color-mix(in srgb,var(--c) 72%,transparent);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px #0b0f16}
table.sk td.sel:not(.own)::after{content:"+";color:#fff}
table.sk td.na{background:repeating-linear-gradient(45deg,#0d121a 0 4px,#151c27 4px 8px);cursor:default}
table.sk td:not(.na):hover{outline:2px solid var(--gold);outline-offset:-2px}
.sk-key{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--steel)}
.sk-key i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
@media (max-width:640px){main{padding:10px}th:nth-child(n+5),td:nth-child(n+5){display:none}table.sk th,table.sk td{display:table-cell!important}}
</style>
</head>
<body>
<div class="login" id="login">
  <h1>운영자 전용</h1>
  <p>최고 관리자 비밀번호 (한글 자판 상태로 쳐도 됩니다)</p>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button class="go" id="go">들어가기</button>
  <div class="err" id="lerr"></div>
</div>
<div id="app" hidden>
  <header>
    <b>13 운영</b>
    <nav id="nav">
      <button data-v="dash" class="on">대시보드</button>
      <button data-v="users">가입자</button>
      <button data-v="rooms">서버·방</button>
      <button data-v="bans">차단</button>
      <button data-v="logs">서버 로그</button>
      <button data-v="config">게임 설정</button>
    </nav>
    <span class="sp"></span>
    <button id="out">나가기</button>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
const API = "/api/v1";
let AT = sessionStorage.getItem("adm_t") || "";
// signed in on the homepage with the owner account: no second password
try { const ss = JSON.parse(localStorage.getItem("lgp_session") || "null"); if (!AT && ss && ss.user && ss.user.owner && ss.atoken && sessionStorage.getItem("lgp_gate") === ss.token) AT = ss.atoken; } catch (e) {}
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const when = (t) => (t ? new Date(t).toLocaleString("ko-KR", { hour12: !1 }) : "-");
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), 2200); };
async function call(a, b = {}) {
  const r = await fetch(API + "?a=" + a, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ atoken: AT }, b)) });
  const j = await r.json().catch(() => ({ ok: !1, error: "서버 응답 없음" }));
  if (!j.ok) { if (r.status === 401 && a.startsWith("a_")) logout(); throw new Error(j.error || "실패"); }
  return j;
}
// typed with the Korean keyboard on: 한글 → gksrmf, the keys that were pressed
const CHO = "r R s e E f a q Q t T d w W c z x v g".split(" "), JUNG = "k o i O j p u P h hk ho hl y n nj np nl b m ml l".split(" "), JONG = ",r,R,rt,s,sw,sg,e,f,fr,fa,fq,ft,fx,fv,fg,a,q,qt,t,T,d,w,c,z,x,v,g".split(",");
const JAMO = { ㄱ: "r", ㄲ: "R", ㄳ: "rt", ㄴ: "s", ㄵ: "sw", ㄶ: "sg", ㄷ: "e", ㄸ: "E", ㄹ: "f", ㄺ: "fr", ㄻ: "fa", ㄼ: "fq", ㄽ: "ft", ㄾ: "fx", ㄿ: "fv", ㅀ: "fg", ㅁ: "a", ㅂ: "q", ㅃ: "Q", ㅄ: "qt", ㅅ: "t", ㅆ: "T", ㅇ: "d", ㅈ: "w", ㅉ: "W", ㅊ: "c", ㅋ: "z", ㅌ: "x", ㅍ: "v", ㅎ: "g", ㅏ: "k", ㅐ: "o", ㅑ: "i", ㅒ: "O", ㅓ: "j", ㅔ: "p", ㅕ: "u", ㅖ: "P", ㅗ: "h", ㅘ: "hk", ㅙ: "ho", ㅚ: "hl", ㅛ: "y", ㅜ: "n", ㅝ: "nj", ㅞ: "np", ㅟ: "nl", ㅠ: "b", ㅡ: "m", ㅢ: "ml", ㅣ: "l" };
const keysOf = (s) => [...s].map((c) => { const n = c.charCodeAt(0) - 0xac00; if (n >= 0 && n < 11172) return CHO[Math.floor(n / 588)] + JUNG[Math.floor((n % 588) / 28)] + JONG[n % 28]; return JAMO[c] || c; }).join("");
async function login() {
  $("#lerr").textContent = "";
  try { const j = await call("admin_login", { pw: keysOf($("#pw").value.trim()) }); AT = j.token; sessionStorage.setItem("adm_t", AT); start(); }
  catch (e) { $("#lerr").textContent = e.message; }
}
function logout() { AT = ""; sessionStorage.removeItem("adm_t"); $("#app").hidden = !0; $("#login").hidden = !1; }
$("#go").onclick = login; $("#pw").onkeydown = (e) => { if (e.key === "Enter") login(); }; $("#out").onclick = logout;
let view = "dash", timer = null;
$("#nav").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; view = b.dataset.v; [...$("#nav").children].forEach((x) => x.classList.toggle("on", x === b)); show(); };
function start() { $("#login").hidden = !0; $("#app").hidden = !1; show(); }
function show() { clearInterval(timer); VIEWS[view]().catch((e) => ($("#main").innerHTML = `<p class="err">${esc(e.message)}</p>`)); }
const days = (msg) => { const v = prompt(msg + "\n며칠? (0 = 영구)", "0"); return v === null ? null : Math.max(0, +v || 0); };
// ── cheats opened for one account, item by item ──
const PERM_NAMES = [["radar", "작은 지도에 적 표시"], ["wall", "벽 너머 적 보기"], ["cheat", "치트 모드 (능력 다시 참·다른 요원 세트)"], ["god", "무적"], ["oneShot", "한 방 처치"], ["infAmmo", "탄약 무제한"], ["noRecoil", "반동 없음"]];
const SHORT = { radar: "레이더", wall: "벽 투시", cheat: "치트 모드", god: "무적", oneShot: "한 방", infAmmo: "탄약 무한", noRecoil: "반동 없음" };
const permParts = (p) => [...PERM_NAMES.filter(([k]) => p[k]).map(([k]) => SHORT[k]), p.speed > 1 ? `속도 ×${p.speed}` : "", p.fastFire > 1 ? `연사 ×${p.fastFire}` : "", p.buff > 0 ? `버프 ${p.buff}초` : ""].filter(Boolean);
function permTag(u) {
  const p = u.permSet;
  if (!p || !p.on) return "";
  const gone = p.until && p.until < Date.now();
  const what = permParts(p).join(" · ") || "아무것도 안 엶";
  return ` <span class="tag ${gone ? "" : "blue"}" title="${esc(what)}">권한${gone ? " 만료" : p.until ? " ~" + when(p.until) : ""}</span><div class="muted">${esc(what)}</div>`;
}
// admin mode: which room settings the account may change, and for how long
const ADMIN_KNOBS = [["run", "이동 속도 (모두)"], ["roundT", "라운드 시간"], ["buyT", "구매 시간"], ["matchT", "데스매치 경기 시간"], ["jumpV", "점프 높이"], ["gravity", "중력"], ["aiSpeed", "봇 속도 배율"], ["infAll", "모든 능력 무제한"], ["freezeAI", "봇 정지"]];
const allowParts = (a) => ADMIN_KNOBS.filter(([k]) => !a || a[k] !== !1).map(([, n]) => n);
function adminTag(u) {
  if (!u.admin) return "";
  const parts = allowParts(u.adminAllow);
  const what = parts.length === ADMIN_KNOBS.length ? "전체 설정 전부" : parts.length ? parts.join(" · ") : "아무 항목도 안 엶";
  return ` <span class="tag gold" title="${esc(what)}">관리자 ~${when(u.adminUntil)}</span><div class="muted">${esc(what)}</div>`;
}
function adminEditor(u, done) {
  const a = u.adminAllow || {};
  const left = u.adminUntil && u.adminUntil > Date.now() ? Math.ceil((u.adminUntil - Date.now()) / 864e5) : 0;
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<div class="sheet">
    <h3>${esc(u.id)} · 관리자 모드</h3>
    <p class="muted">게임 안 관리자 조절판의 '전체 설정'(방 전체 규칙) 중 이 계정이 바꿀 수 있는 항목을 고릅니다. 방장일 때 방 전체에 적용되고, 고르지 않은 항목은 조절판에 보이지 않습니다. 개인 치트는 '권한'에서 따로 정합니다.</p>
    <div class="grid2">${ADMIN_KNOBS.map(([k, n]) => `<label class="row"><input type="checkbox" data-k="${k}" ${a[k] !== !1 ? "checked" : ""}> ${n}</label>`).join("")}</div>
    <div class="row" style="gap:8px;margin-top:8px"><button id="am-all">전부 선택</button><button id="am-none">전부 해제</button></div>
    <div class="grid3">
      <label>기간 (일) <span class="muted">오늘부터. 0 = 지금 닫기</span><input type="number" id="am-days" min="0" max="3650" step="1" value="${left || 30}"></label>
    </div>
    <div class="row end"><button id="am-off" class="bad">관리자 모드 닫기</button><span style="flex:1"></span><button id="am-x">취소</button><button id="am-save" class="go">저장</button></div>
  </div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.onclick = (e) => { if (e.target === box) close(); };
  $("#am-x", box).onclick = close;
  $("#am-all", box).onclick = () => box.querySelectorAll("[data-k]").forEach((c) => (c.checked = !0));
  $("#am-none", box).onclick = () => box.querySelectorAll("[data-k]").forEach((c) => (c.checked = !1));
  const send = async (days) => {
    const allow = {};
    box.querySelectorAll("[data-k]").forEach((c) => (allow[c.dataset.k] = c.checked));
    await call("a_user_set", { id: u.id, op: "admin", days, allow });
    toast(days > 0 ? "관리자 모드를 열었습니다" : "관리자 모드를 닫았습니다");
    close();
    done();
  };
  $("#am-off", box).onclick = () => send(0);
  $("#am-save", box).onclick = () => send(Math.max(0, +$("#am-days", box).value || 0));
}
function permEditor(u, done) {
  const p = Object.assign({ on: !0, speed: 1, fastFire: 1, buff: 0 }, u.permSet || {});
  const left = p.until && p.until > Date.now() ? Math.ceil((p.until - Date.now()) / 864e5) : 0;
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<div class="sheet">
    <h3>${esc(u.id)} · 권한</h3>
    <p class="muted">이 계정으로 들어오면 아래에서 고른 치트만 열립니다. 같이 하기에서는 방장이 서버에 확인한 뒤 같은 한도로 적용합니다.</p>
    <label class="row big"><input type="checkbox" id="pm-on" ${p.on ? "checked" : ""}> <b>권한 켜기</b> <span class="muted">끄면 아무것도 안 열립니다</span></label>
    <div class="grid2">${PERM_NAMES.map(([k, n]) => `<label class="row"><input type="checkbox" data-k="${k}" ${p[k] ? "checked" : ""}> ${n}</label>`).join("")}</div>
    <div class="grid3">
      <label>이동 속도 최대 <span class="muted">1 = 못 바꿈, 최대 3</span><input type="number" id="pm-speed" min="1" max="3" step="0.1" value="${p.speed}"></label>
      <label>연사 속도 최대 <span class="muted">1 = 못 바꿈, 최대 10</span><input type="number" id="pm-fire" min="1" max="10" step="0.5" value="${p.fastFire}"></label>
      <label>버프 (초) <span class="muted">궁극기를 뺀 모든 능력이 이 간격마다 다시 참. 0 = 끔</span><input type="number" id="pm-buff" min="0" max="120" step="1" value="${p.buff}"></label>
      <label>기간 (일) <span class="muted">0 = 기한 없음</span><input type="number" id="pm-days" min="0" max="3650" step="1" value="${left}"></label>
    </div>
    <div class="row end"><button id="pm-clear" class="bad">권한 모두 지우기</button><span style="flex:1"></span><button id="pm-x">취소</button><button id="pm-save" class="go">저장</button></div>
  </div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  // (a handler that returns false cancels the click, which would stop the checkboxes ticking)
  box.onclick = (e) => {
    if (e.target === box) close();
  };
  $("#pm-x", box).onclick = close;
  const send = async (perm, d) => {
    await call("a_user_set", { id: u.id, op: "perm", perm, days: d });
    toast("권한을 저장했습니다");
    close();
    done();
  };
  $("#pm-clear", box).onclick = () => confirm(u.id + "의 권한을 모두 지울까요?") && send({ on: !1 }, 0);
  $("#pm-save", box).onclick = () => {
    const perm = { on: $("#pm-on", box).checked, speed: +$("#pm-speed", box).value || 1, fastFire: +$("#pm-fire", box).value || 1, buff: +$("#pm-buff", box).value || 0 };

async function skinEditor(u, done) {
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<div class="sheet wide"><h3>${esc(u.id)} · 스킨 지급·회수</h3><p class="muted">불러오는 중…</p></div>`;

  const fit = (s, g) => !only[s] || only[s] === g;

  box.querySelector(".sheet").innerHTML = `<h3>${esc(u.id)} · 스킨 지급·회수</h3>

    <div class="sk-tools"><span>보유 <b id="sk-own"></b> / ${items}</span><span class="muted">· 선택 <b id="sk-n">0</b>개</span><span class="sp"></span>
      ${[1, 2, 3, 4].map((t) => `<button data-tier="${t}" style="color:${TIER_C[t]}">${TIER_KO[t]} 전부</button>`).join("")}
      <button id="sk-miss">없는 것 전부</button><button id="sk-have">가진 것 전부</button><button id="sk-clear">선택 해제</button></div>
    <div class="sk-wrap"><table class="sk"><tr><th class="corner">총 \\ 스킨</th>${skins.map((s) => `<th data-col="${s}" style="color:${TIER_C[tiers[s]]}" title="${TIER_KO[tiers[s]]} · 눌러서 이 스킨 전부 고르기">${esc(SKIN_KO[s] || s)}</th>`).join("")}</tr>
      ${guns.map((g) => `<tr><th data-row="${g}" title="눌러서 이 총의 스킨 전부 고르기">${esc(GUN_KO[g] || g)}</th>${skins.map((s) => (fit(s, g) ? `<td data-g="${g}" data-s="${s}" style="--c:${TIER_C[tiers[s]]}" title="${esc((GUN_KO[g] || g) + " · " + (SKIN_KO[s] || s))}"></td>` : '<td class="na"></td>')).join("")}</tr>`).join("")}</table></div>
    <div class="sk-key">${[1, 2, 3, 4].map((t) => `<span><i style="background:${TIER_C[t]}"></i>${TIER_KO[t]} 보유</span>`).join("")}<span><i style="box-shadow:inset 0 0 0 2px #fff"></i>선택</span><span><i style="background:repeating-linear-gradient(45deg,#0d121a 0 3px,#2a3444 3px 6px)"></i>그 총에는 없는 스킨</span></div>
    <div class="row end" style="flex-wrap:wrap"><button id="sk-all" class="gold">전부 지급 (${items})</button><button id="sk-none" class="bad">전부 회수</button><span style="flex:1"></span><button id="sk-give" class="go">선택 지급</button><button id="sk-take" class="bad">선택 회수</button><button id="sk-x">닫기</button></div>`;

  $("#sk-x", box).onclick = close;
  const send = async (p, msg) => {
    try {
      await call("a_user_set", Object.assign({ id: u.id, op: "grant" }, p));
      own = (await call("a_user_skins", { id: u.id })).own;

      done();
    } catch (e) { toast(e.message); }
  };
  $("#sk-give", box).onclick = () => sel.size && send({ items: [...sel] }, `${sel.size}개 지급했습니다`);
  $("#sk-take", box).onclick = () => sel.size && send({ items: [...sel], remove: !0 }, `${sel.size}개 회수했습니다`);
  $("#sk-all", box).onclick = () => send({ item: "all" }, `스킨 ${items}개 전부 지급했습니다`);
  $("#sk-none", box).onclick = () => confirm(u.id + "의 스킨을 전부 회수할까요?") && send({ item: "all", remove: !0 }, "스킨을 전부 회수했습니다");
  paint();

  $("#main").innerHTML = `<div class="sec"><h3>기기·IP 차단 추가</h3><div class="d">기기 ID는 가입자 목록이나 로그에서 볼 수 있습니다.</div>
    <div class="bar"><select id="bk"><option value="dev">기기</option><option value="ip">IP</option></select><input id="bv" placeholder="기기 ID 또는 IP"><input id="bd" type="number" value="0" style="width:80px" title="일 (0=영구)"><input id="br" placeholder="사유"><button class="go" id="ba">차단</button></div></div>
    <table><tr><th>종류</th><th>대상</th><th>사유</th><th>기간</th><th>차단 시각</th><th></th></tr>${j.bans.map((b) => `<tr><td>${{ user: "계정", dev: "기기", ip: "IP" }[b.kind]}</td><td>${esc(b.key)}</td><td>${esc(b.reason)}</td><td>${b.until ? "~" + when(b.until) : "영구"}</td><td>${when(b.at)}</td><td><button data-k="${b.kind}" data-v="${esc(b.key)}">풀기</button></td></tr>`).join("") || '<tr><td colspan="6" class="muted">차단 없음</td></tr>'}</table>`;
  $("#ba").onclick = async () => { await call("a_ban_set", { kind: $("#bk").value, key: $("#bv").value.trim(), days: +$("#bd").value || 0, reason: $("#br").value }); toast("차단했습니다"); VIEWS.bans(); };
  $("#main").querySelector("table").onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.k === "user") await call("a_user_set", { id: b.dataset.v, op: "unban" });
    else await call("a_ban_set", { kind: b.dataset.k, key: b.dataset.v, remove: !0 });
    toast("풀었습니다"); VIEWS.bans();
  };
};
VIEWS.logs = async () => {
  $("#main").innerHTML = `<div class="bar"><select id="lt"><option value="">전체</option><option value="login">로그인</option><option value="join">가입</option><option value="guest">게스트</option><option value="auth">로그인 실패</option><option value="room">방</option><option value="level">레벨</option><option value="admin">운영</option></select><input id="lq" placeholder="검색"><button id="lr">새로고침</button><button id="lc" class="bad">로그 비우기</button></div><div id="ll"></div>`;
  const load = async () => { const j = await call("a_logs", { type: $("#lt").value, q: $("#lq").value, limit: 2000 });
    $("#ll").innerHTML = `<table class="log"><tr><th>시각</th><th>종류</th><th>내용</th><th>IP</th></tr>${j.logs.map((r) => `<tr><td>${when(r.t)}</td><td><span class="tag">${esc(r.type)}</span></td><td>${esc(r.msg)}</td><td>${esc(r.ip || "")}</td></tr>`).join("")}</table>`; };
  $("#lr").onclick = load; $("#lt").onchange = load; $("#lq").onkeydown = (e) => { if (e.key === "Enter") load(); };
  $("#lc").onclick = async () => { if (confirm("로그를 모두 지울까요?")) { await call("a_logs_clear"); load(); } };
  await load();
};

VIEWS.config = async () => {
  const { config, defaults } = await call("a_config_get");
  const form = (obj, pre) => Object.keys(obj).filter((k) => k !== "channels").map((k) => {
    const key = pre ? pre + "." + k : k, v = obj[k], [name, desc] = LABELS[key] || [k];
    if (v && typeof v === "object" && !Array.isArray(v)) return `<div class="${pre ? "f wide" : "sec"}">${pre ? `<label>${esc(name)}${desc ? `<small>${esc(desc)}</small>` : ""}</label>` : `<h3>${esc(name)}</h3><div class="d">${esc(desc || "")}</div>`}<div class="grid">${form(v, key)}</div></div>`;
    const inp = typeof v === "boolean" ? `<input type="checkbox" data-k="${key}" ${v ? "checked" : ""}>` : typeof v === "number" ? `<input type="number" step="any" data-k="${key}" value="${v}">` : `<input type="text" data-k="${key}" value="${esc(v)}">`;
    return `<div class="f ${typeof v === "string" ? "wide" : ""}"><label>${esc(name)}${desc ? `<small>${esc(desc)}</small>` : ""}</label>${inp}</div>`;
  }).join("");
  $("#main").innerHTML = form(config, "") + `<div class="sec"><h3>서버(채널)</h3><div class="d">게임의 같이 하기 화면에서 고르는 서버 목록. 한 줄에 하나: <code>아이디, 한국어 이름, 영어 이름</code>. 끝에 <code>, 모바일</code>을 붙이면 폰·앱 전용 서버가 됩니다.</div><textarea id="chs" rows="6" style="width:100%">${esc(config.channels.map((c) => [c.id, c.name, c.en || ""].concat(c.mobile ? ["모바일"] : []).join(", ")).join("\n"))}</textarea></div>
    <div class="save"><button class="bad" id="crst">전부 기본값</button><button class="go" id="csave">저장</button></div>`;
  $("#csave").onclick = async () => {
    const c = JSON.parse(JSON.stringify(config));
    $("#main").querySelectorAll("[data-k]").forEach((el) => {
      const path = el.dataset.k.split("."); let o = c; path.slice(0, -1).forEach((p) => (o = o[p]));
      const last = path[path.length - 1];
      o[last] = el.type === "checkbox" ? el.checked : el.type === "number" ? +el.value : el.value;
    });
    c.channels = $("#chs").value.split("\n").map((l) => l.split(",").map((s) => s.trim())).filter((a) => a[0]).map(([id, name, en, m]) => Object.assign({ id, name: name || id, en: en || name || id }, /^(모바일|mobile|1)$/i.test(m || "") ? { mobile: !0 } : {}));
    await call("a_config_set", { config: c }); toast("저장했습니다. 게임에는 다음 접속·다음 신호 때 적용됩니다");
  };
  $("#crst").onclick = async () => { if (confirm("모든 설정을 기본값으로 되돌릴까요?")) { await call("a_config_reset"); VIEWS.config(); } };
};
