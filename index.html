<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>13</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="description" content="5대5 전술 FPS · 5v5 tactical shooter in the browser">
<meta property="og:title" content="13">
<meta property="og:description" content="브라우저에서 바로 하는 5대5 전술 교전 · 5v5 tactical shooter, right in the browser">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--void:#0a0d12;--panel:#141922;--panel2:#1b222e;--line:#2a3444;--steel:#8a97ab;--dim:#5b6879;--ink:#e8edf4;--red:#ff3b4e;--gold:#ffc849;--cyan:#22d3ee;--green:#4ade80;
--fd:'Orbitron',system-ui,sans-serif;--fb:'Noto Sans KR',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;min-height:100vh;
background-image:radial-gradient(ellipse 90% 55% at 50% 0%,#17202f 0%,transparent 65%)}
button,input,select{font:inherit;color:inherit}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg-grid{position:absolute;left:50%;top:30%;width:260vw;height:150vh;transform:translateX(-50%) perspective(340px) rotateX(64deg);
background-image:linear-gradient(rgba(56,189,248,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.14) 1px,transparent 1px);
background-size:58px 58px;mask-image:radial-gradient(ellipse 52% 62% at 50% 34%,#000 0%,transparent 78%);-webkit-mask-image:radial-gradient(ellipse 52% 62% at 50% 34%,#000 0%,transparent 78%);animation:gridRun 14s linear infinite}
@keyframes gridRun{to{background-position:0 58px,0 0}}
@media(prefers-reduced-motion:reduce){.bg-grid{animation:none}}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0}
.logo{font-family:var(--fd);font-weight:900;font-size:24px;letter-spacing:.06em}
.sp{flex:1}
.chip{border:1px solid var(--line);background:rgba(20,25,34,.8);border-radius:99px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold)}
.notice{margin:6px 0 0;padding:10px 14px;border:1px solid #5c4b1f;background:rgba(255,200,73,.08);color:var(--gold);border-radius:12px;font-size:13px}
.notice.red{border-color:#5c2630;background:rgba(255,59,78,.08);color:#ff9aa5}
.hero{text-align:center;padding:42px 0 26px}
.hero h1{font-family:var(--fd);font-weight:900;font-size:clamp(48px,11vw,96px);letter-spacing:.05em;line-height:1;
background:linear-gradient(170deg,#fff 0%,#8fa4c0 55%,#2d3a4d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-family:var(--fd);font-size:12px;letter-spacing:.45em;color:var(--red);margin-top:12px}
.hero p{color:var(--steel);font-size:14.5px;line-height:1.8;max-width:48ch;margin:16px auto 0}
.box{background:linear-gradient(160deg,var(--panel2),var(--panel) 62%);border:1px solid var(--line);border-radius:20px;padding:20px}
.auth{max-width:380px;margin:0 auto 40px}
.auth h3{font-size:16px;margin-bottom:4px}.auth .d{color:var(--steel);font-size:12px;margin-bottom:14px;line-height:1.6}
.in{width:100%;background:#0d121a;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.in:focus{outline:none;border-color:var(--gold)}
.btn{color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:11px 18px;background:var(--panel2);cursor:pointer;font-weight:700;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--steel)}
.btn.go{background:linear-gradient(180deg,#ff5566,var(--red));border-color:#ff6673;color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}
.btn.w{width:100%}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:12px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:#ff8a95;font-size:12.5px;min-height:18px;margin-top:6px;text-align:center}
.card{max-width:440px;margin:0 auto 40px;padding:24px 22px 20px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 55% at 18% 0%,rgba(255,200,73,.13),transparent 70%);pointer-events:none}
.pf{display:flex;align-items:center;gap:18px;position:relative}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:#0d121a}
.ring .fg{stroke:url(#xpg);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.3,1)}
.lvl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lvl small{font-family:var(--fd);font-size:10px;letter-spacing:.3em;color:var(--steel);margin-left:.3em}
.lvl b{font-family:var(--fd);font-size:34px;font-weight:900;color:var(--gold);margin-top:2px}
.who{min-width:0;flex:1}
.nm{font-size:21px;font-weight:900;word-break:break-all;line-height:1.3}
.rank{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:99px;border:1px solid #5c4b1f;color:var(--gold);background:rgba(255,200,73,.07)}
.xpt{margin-top:8px;font-size:12px;color:var(--steel)}
.xpbar{height:6px;margin-top:6px;background:#0d121a;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff8a3c);transition:width 1s cubic-bezier(.2,.7,.3,1)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px;text-align:center}
.st div{background:#0f141d;border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:11px;color:var(--steel)}
.st b{display:block;color:var(--ink);font-size:18px;font-family:var(--fd);margin-bottom:2px}
.wallet{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12px;color:var(--steel)}
.wallet span{padding:5px 12px;border:1px solid var(--line);border-radius:999px}
.wallet .g{color:var(--gold);border-color:#5c4b1f;font-family:var(--fd)}
.hist{max-width:720px;margin:-18px auto 40px}
.hist h3{font-family:var(--fd);font-size:12px;letter-spacing:.18em;color:var(--steel-dim);margin:0 0 10px 4px;text-transform:uppercase}
.hr{display:grid;grid-template-columns:92px minmax(0,1.6fr) minmax(0,1fr) 64px;gap:10px;align-items:center;padding:10px 12px;margin-bottom:6px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--steel-dim);background:var(--panel)}
.hr.win{border-left-color:var(--green);background:linear-gradient(90deg,rgba(74,222,128,.1),var(--panel) 60%)}
.hr.loss{border-left-color:var(--red);background:linear-gradient(90deg,rgba(255,59,78,.1),var(--panel) 60%)}
.hr b{display:block;font-family:var(--fd);font-size:14px}
.hr small,.hr span{display:block;font-size:11px;color:var(--steel)}
.hr .res b{font-size:15px}.hr.win .res b{color:var(--green)}.hr.loss .res b{color:var(--red)}
.hr .mid b{font-family:var(--fb,inherit);font-size:13px;font-weight:700}
.hr .mvp{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;border:1px solid #5c4b1f;color:var(--gold);font-size:9px;letter-spacing:.1em;font-family:var(--fd)}
.hist .empty{padding:14px;text-align:center;color:var(--steel-dim);font-size:12px;border:1px dashed var(--line);border-radius:12px}
@media(max-width:600px){.hr{grid-template-columns:76px minmax(0,1.4fr) minmax(0,1fr);gap:8px;padding:9px 10px}.hr .cs{display:none}.hr b{font-size:12.5px}}
.inv{margin-top:14px;padding:10px 14px;border-radius:12px;border:1px solid #1f5c36;background:rgba(74,222,128,.07);color:var(--green);font-size:13px;text-align:center}
.inv b{font-family:var(--fd);letter-spacing:.18em;margin-left:6px}
.enter{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;padding:17px;border-radius:14px;font-size:17px;font-weight:900;letter-spacing:.04em;color:#fff;text-decoration:none;
background:linear-gradient(180deg,#ff5b6b,#e0303f);border:1px solid rgba(255,140,150,.6);box-shadow:0 16px 36px -14px rgba(255,59,78,.9),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,filter .15s}
.enter:hover{filter:brightness(1.07);transform:translateY(-1px)}
.enter:active{transform:translateY(1px)}
.enter i{font-style:normal;font-size:24px;line-height:1;margin-top:-2px}
.hint{margin-top:10px;text-align:center;font-size:12px;color:var(--dim)}
.skip{display:block;margin-top:8px;text-align:center;font-size:12px;color:var(--steel)}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--steel);margin-left:6px;vertical-align:middle;text-decoration:none}
@media(max-width:420px){.pf{gap:14px}.ring{width:88px;height:88px}.lvl b{font-size:28px}.st{grid-template-columns:repeat(2,1fr)}}
@media(max-height:560px){.hero{padding:16px 0 12px}.hero h1{font-size:52px}.hero p{display:none}.card{padding:16px 18px 14px}}
@media(max-height:560px) and (min-width:640px){
  .top{padding:8px 0}
  .stage{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:24px;align-items:center;min-height:calc(100vh - 52px);padding-bottom:12px}
  .hero{text-align:left;padding:0}
  .hero h1{font-size:clamp(56px,10vh,84px)}
  .hero .sub{letter-spacing:.32em;margin-top:8px}
  .auth,.card{margin:0;max-width:none}
  .auth .d{display:none}
  .auth h3{margin-bottom:10px}
  .in{padding:10px 12px;margin-bottom:8px}
  .or{margin:8px 0}
  .card{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.62fr);gap:16px;align-items:center;padding:16px}
  .ring{width:76px;height:76px}.lvl b{font-size:24px}.lvl small{font-size:8px}
  .pf{gap:12px}.nm{font-size:17px}.rank{margin-top:3px}.xpt{margin-top:5px}
  .st{grid-template-columns:repeat(4,1fr);margin-top:12px;gap:5px}.st div{padding:7px 2px}.st b{font-size:15px}
  .inv{margin:0 0 10px;padding:8px;font-size:12px}
  .enter{margin:0;padding:22px 10px;font-size:16px}
  .hint{font-size:11px}
  section{padding-top:24px}
}
[hidden]{display:none!important}
h2{font-family:var(--fd);font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:0 0 12px}
section{padding:36px 0;border-top:1px solid var(--line)}
.feat{list-style:none;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.feat li{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13px;color:var(--steel);line-height:1.65}
.feat b{color:var(--ink)}
footer{padding:30px 0;border-top:1px solid var(--line);text-align:center;font-size:11.5px;color:var(--dim)}
footer a{color:var(--steel)}
.banned{max-width:420px;margin:60px auto;text-align:center}
.banned b{font-size:22px;color:#ff9aa5}
</style>
</head>
<body>
<div class="bg"><div class="bg-grid"></div></div>
<div class="wrap">
  <div class="top">
    <div class="logo">13</div>
    <span class="sp"></span>
    <button class="chip" id="lang">English</button>
    <button class="chip" id="logout" hidden data-t="logout"></button>
  </div>
  <div id="notices"></div>

  <div class="stage">
  <div class="hero" id="hero"><h1>13</h1><div class="sub">TACTICAL SHOOTER</div><p data-t="lead"></p></div>
  <div class="views">
  <div id="v-auth" hidden>
    <div class="box auth">
      <h3 data-t="signin"></h3>
      <div class="d" data-t="signinDesc"></div>
      <input class="in" id="uid" autocomplete="username" maxlength="16">
      <input class="in" id="upw" type="password" autocomplete="current-password" maxlength="64">
      <button class="btn go w" id="doAuth" data-t="signinBtn"></button>
      <div class="or" data-t="or"></div>
      <button class="btn w" id="doGuest" data-t="guestBtn"></button>
      <div class="err" id="aerr"></div>
    </div>
  </div>

  <div id="v-dash" hidden>
    <div class="box card">
      <div class="me">
      <div class="pf">
        <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="xpg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc849"/><stop offset="1" stop-color="#ff8a3c"/></linearGradient></defs><circle class="bgc" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
          <div class="lvl"><small>LV</small><b id="meLv">1</b></div></div>
        <div class="who">
          <div class="nm" id="meName"></div>
          <span class="rank" id="meRank"></span>
          <div class="xpbar"><i id="meXp"></i></div>
          <div class="xpt" id="meXpT"></div>

      <div class="st"><div><b id="meK">0</b><span data-t="kills"></span></div><div><b id="meW">0</b><span data-t="wins"></span></div><div><b id="meM">0</b><span data-t="matches"></span></div><div><b id="meR">-</b><span data-t="winRate"></span></div></div>
      <div class="wallet"><span class="g" id="meGold">🪙 0</span><span id="meSkins"></span></div>
      </div>
      <div class="go">
      <div class="inv" id="inv" hidden></div>
      <a class="enter" id="enter" href="./play.html"><span id="enterT" data-t="enter"></span><i>›</i></a>
      <div class="hint" id="hint" data-t="enterHint"></div>
      <a class="skip" id="skip" href="./play.html" hidden data-t="skipInvite"></a>
      </div>
    </div>
  </div>

  </div>
  </div>

  <section>
    <h2 data-t="about"></h2>
    <ul class="feat" id="feat"></ul>
  </section>
  <footer><a href="./privacy.html" data-t="privacy"></a> · 13</footer>
</div>


<script>
const API = "/api/v1";
const T = {

const t = (k, ...a) => (typeof T[L][k] === "function" ? T[L][k](...a) : T[L][k] ?? k);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
// where "enter" goes: the game, with the room of an invite link and the app flag
const Q = new URLSearchParams(location.search);
const ROOM = (Q.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
try { if (Q.get("source") === "app") sessionStorage.setItem("lgp_app", "1"); } catch (e) {}
const APP = (() => { try { return sessionStorage.getItem("lgp_app") === "1"; } catch (e) { return !1; } })();
const gameUrl = (room) => { const o = new URLSearchParams(); room && o.set("room", room); APP && o.set("source", "app"); return "./play.html" + (o.toString() ? "?" + o : ""); };
function paintLang() {
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach((e) => (e.textContent = t(e.dataset.t)));
  $("#uid").placeholder = t("idPh"); $("#upw").placeholder = t("pwPh");
  $("#lang").textContent = L === "ko" ? "English" : "한국어";
  $("#feat").innerHTML = T[L].feat.map((x) => `<li>${x}</li>`).join("");
  drawEnter();
  CFG && (drawMe(), drawNotices());
}
$("#lang").onclick = () => { L = L === "ko" ? "en" : "ko"; localStorage.setItem("lgp_lang", L); paintLang(); };

// a password typed with the Korean keyboard on counts as the keys pressed (한글 = gksrmf)
const CHO = "r R s e E f a q Q t T d w W c z x v g".split(" "), JUNG = "k o i O j p u P h hk ho hl y n nj np nl b m ml l".split(" "), JONG = ",r,R,rt,s,sw,sg,e,f,fr,fa,fq,ft,fx,fv,fg,a,q,qt,t,T,d,w,c,z,x,v,g".split(",");
const JAMO = { ㄱ: "r", ㄲ: "R", ㄳ: "rt", ㄴ: "s", ㄵ: "sw", ㄶ: "sg", ㄷ: "e", ㄸ: "E", ㄹ: "f", ㄺ: "fr", ㄻ: "fa", ㄼ: "fq", ㄽ: "ft", ㄾ: "fx", ㄿ: "fv", ㅀ: "fg", ㅁ: "a", ㅂ: "q", ㅃ: "Q", ㅄ: "qt", ㅅ: "t", ㅆ: "T", ㅇ: "d", ㅈ: "w", ㅉ: "W", ㅊ: "c", ㅋ: "z", ㅌ: "x", ㅍ: "v", ㅎ: "g", ㅏ: "k", ㅐ: "o", ㅑ: "i", ㅒ: "O", ㅓ: "j", ㅔ: "p", ㅕ: "u", ㅖ: "P", ㅗ: "h", ㅘ: "hk", ㅙ: "ho", ㅚ: "hl", ㅛ: "y", ㅜ: "n", ㅝ: "nj", ㅞ: "np", ㅟ: "nl", ㅠ: "b", ㅡ: "m", ㅢ: "ml", ㅣ: "l" };
const keysOf = (s) => [...s].map((c) => { const n = c.charCodeAt(0) - 0xac00; if (n >= 0 && n < 11172) return CHO[Math.floor(n / 588)] + JUNG[Math.floor((n % 588) / 28)] + JONG[n % 28]; return JAMO[c] || c; }).join("");
const device = (() => { let d = localStorage.getItem("lgp_device"); if (!d) { d = "d" + crypto.getRandomValues(new Uint32Array(3)).join("").slice(0, 24); localStorage.setItem("lgp_device", d); } return d; })();
let S = null; try { S = JSON.parse(localStorage.getItem("lgp_session") || "null"); } catch (e) {}
let CFG = null, OFFLINE = !1;
async function api(a, b) {
  const r = await fetch(API + "?a=" + a, { method: b ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: b ? JSON.stringify(b) : undefined });
  const j = await r.json().catch(() => ({ ok: !1, error: "offline" }));
  if (!j.ok) throw Object.assign(new Error(j.error || "error"), { status: r.status, ban: j.ban });
  return j;
}
function save(sess) { sess && !sess.hist && S && S.hist && (sess.hist = S.hist); S = sess; if (sess) { localStorage.setItem("lgp_session", JSON.stringify(sess)); localStorage.setItem("lgp_name", sess.user.id); } else { localStorage.removeItem("lgp_session"); sessionStorage.removeItem("lgp_gate"); } }
// a sign-in from an earlier visit does not count: each visit logs in again (this tab keeps it)
const gatePassed = () => { try { return !!(S && S.token) && sessionStorage.getItem("lgp_gate") === S.token; } catch (e) { return !1; } };
function view(v) { ["auth", "dash", "ban"].forEach((x) => ($("#v-" + x).hidden = x !== v)); $("#logout").hidden = v !== "dash" || !S; $("#hero").hidden = v === "ban"; try { scrollTo(0, 0); } catch (e) {} }
function drawNotices() {
  const n = [];
  if (OFFLINE) n.push(`<div class="notice">${esc(t("offline"))}</div>`);
  if (CFG && CFG.game.maintenance) n.push(`<div class="notice red">${esc(CFG.game.maintenanceMsg)}</div>`);
  if (CFG && CFG.game.announcement) n.push(`<div class="notice">📢 ${esc(CFG.game.announcement)}</div>`);
  $("#notices").innerHTML = n.join("");
}
const rankOf = (lv) => T[L].ranks[lv >= 50 ? 5 : lv >= 30 ? 4 : lv >= 20 ? 3 : lv >= 10 ? 2 : lv >= 5 ? 1 : 0];
function drawMe() {
  if (!S) return;
  const u = S.user, lv = u.level || 1, k = Math.max(0, Math.min(1, (u.into || 0) / Math.max(1, u.need || 1)));
  $("#meName").innerHTML = esc(u.id) + (u.guest ? ` <span class="tag">${t("guestTag")}</span>` : "") + (u.owner ? ' <span class="tag" style="color:var(--gold)">OWNER</span> <a class="tag" href="/admin" style="color:var(--gold)">운영자 페이지 ›</a>' : u.admin ? ' <span class="tag" style="color:var(--gold)">ADMIN</span>' : "");
  $("#meLv").textContent = lv;
  $("#meRank").textContent = rankOf(lv);
  $("#meXp").style.width = Math.round(100 * k) + "%";
  $("#ringFg").style.strokeDashoffset = String(326.7 * (1 - k));
  $("#meXpT").textContent = t("lvNext", u.into || 0, u.need || 100);
  $("#meK").textContent = u.kills || 0; $("#meW").textContent = u.wins || 0; $("#meM").textContent = u.matches || 0;
  $("#meR").textContent = u.matches ? Math.round((100 * (u.wins || 0)) / u.matches) + "%" : "-";
  // gold and the skin collection (only an account server knows them)
  const wallet = typeof u.gold === "number";
  $("#meGold").hidden = $("#meSkins").hidden = !wallet;
  $("#meGold").textContent = "🪙 " + (u.gold || 0).toLocaleString();
  $("#meGold").title = t("gold");
  $("#meSkins").textContent = t("skins", u.owned || 0, u.items || 501);
  drawHist();
}
// the last matches, newest first (the game sends a summary with each report)
function drawHist() {
  const h = $("#hist"), list = (S && S.hist) || [];
  h.hidden = !S || !S.user || typeof S.user.gold !== "number";
  if (h.hidden) return;
  const when = (ms) => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  $("#histList").innerHTML = list.length ? list.map((m) => {
    const ffa = m.mode === "dm", draw = !ffa && m.s && m.s[0] === m.s[1];
    const res = ffa ? t("place", m.rank || 1) : draw ? t("draw") : m.win ? t("win") : t("loss");
    const sc = ffa ? t("kills1", m.k || 0) : `${m.s ? m.s[0] : 0} - ${m.s ? m.s[1] : 0}`;
    return `<div class="hr ${m.win ? "win" : draw ? "" : "loss"}"><div class="res"><b>${esc(res)}</b><span>${esc(sc)}</span></div>
      <div class="mid"><b>${esc(T[L].modes[m.mode] || m.mode)}${m.map ? " · " + esc(m.map) : ""}${m.mvp ? '<i class="mvp">MVP</i>' : ""}</b><small>${esc(m.agent || "")}${m.agent ? " · " : ""}${when(m.t)}</small></div>
      <div class="kda"><b>${m.k | 0} / ${m.d | 0} / ${m.a | 0}</b><small>K / D / A</small></div>
      <div class="cs"><b>${m.cs | 0}</b><small>${esc(t("score"))}</small></div></div>`;
  }).join("") : `<div class="empty">${esc(t("noHist"))}</div>`;
}
function drawEnter() {
  $("#enter").href = gameUrl(ROOM);
  $("#enterT").textContent = ROOM ? t("joinInvite", ROOM) : t("enter");
  $("#inv").hidden = !ROOM; $("#inv").innerHTML = ROOM ? `${esc(t("invited"))}<b>${esc(ROOM)}</b>` : "";
  $("#skip").hidden = !ROOM; $("#skip").href = gameUrl("");
  $("#hint").hidden = !!ROOM;
}
$("#logout").onclick = () => { save(null); view("auth"); };
function showBan(b) { view("ban"); $("#banWhy").textContent = (b.reason ? t("reason") + ": " + b.reason + " · " : "") + (b.until ? new Date(b.until).toLocaleString() + " " + t("until") : t("forever")); }
async function auth(guest) {
  $("#aerr").textContent = "";
  $("#doAuth").disabled = $("#doGuest").disabled = !0;
  try {
    const j = guest ? await api("guest", { device }) : await api("auth", { id: $("#uid").value.trim(), pw: keysOf($("#upw").value), device });
    save({ token: j.token, user: j.user, atoken: j.atoken || "", hist: j.hist || [] });
    try { sessionStorage.setItem("lgp_gate", j.token); } catch (e) {}
    enter();
  } catch (e) {
    if (e.ban) return showBan(e.ban);
    if (guest && (e.status === 503 || e.message === "offline" || e.status === 404)) {
      // the account server is down: a guest still gets into the game (no level, no list)
      save({ token: "", user: { id: localStorage.getItem("lgp_name") || "Guest" + Math.floor(Math.random() * 9000 + 1000), guest: !0, level: 1, into: 0, need: 100, xp: 0, kills: 0, wins: 0, matches: 0 } });
      try { sessionStorage.setItem("lgp_gate", "offline"); } catch (x) {}
      OFFLINE = !0; drawNotices(); return enter();
    }
    $("#aerr").textContent = e.message === "offline" ? t("offline") : e.message;
  } finally { $("#doAuth").disabled = $("#doGuest").disabled = !1; }
}
$("#doAuth").onclick = () => auth(!1); $("#doGuest").onclick = () => auth(!0);
$("#upw").onkeydown = (e) => { if (e.key === "Enter") auth(!1); };
$("#uid").onkeydown = (e) => { if (e.key === "Enter") $("#upw").focus(); };
function enter() { view("dash"); drawMe(); drawEnter(); }
(async () => {
  paintLang();
  try { CFG = (await api("config")).config; OFFLINE = !1; } catch (e) { OFFLINE = !0; CFG = { game: {}, channels: [] }; }
  drawNotices();
  const offlineGuest = (() => { try { return !!S && !S.token && sessionStorage.getItem("lgp_gate") === "offline"; } catch (e) { return !1; } })();
  if (S && S.token && !gatePassed()) {
    // ask again; the last id is filled in
    view("auth");
    try { $("#uid").value = S.user && !S.user.guest ? S.user.id : localStorage.getItem("lgp_name") || ""; $("#uid").value && $("#upw").focus(); } catch (e) {}
  } else if (S && S.token) {
    try { const j = await api("me", { token: S.token }); S.user = j.user; S.atoken = j.atoken || ""; S.hist = j.hist || S.hist || []; save(S); enter(); }
    catch (e) { if (e.ban) showBan(e.ban); else if (e.status === 401) { save(null); view("auth"); } else enter(); }
  } else if (offlineGuest) enter();
  else view("auth");
  paintLang();
})();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>
