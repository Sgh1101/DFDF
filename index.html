<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>13</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="description" content="5대5 전술 FPS · 5v5 tactical shooter in the browser">
<meta property="og:title" content="13">
<meta property="og:description" content="브라우저에서 바로 하는 5대5 전술 교전 · 5v5 tactical shooter, right in the browser">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--void:#0a0d12;--panel:#141922;--panel2:#1b222e;--line:#2a3444;--steel:#8a97ab;--dim:#5b6879;--ink:#e8edf4;--red:#ff3b4e;--gold:#ffc849;--cyan:#22d3ee;--green:#4ade80;
--fd:'Orbitron',system-ui,sans-serif;--fb:'Noto Sans KR',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;min-height:100vh;
background-image:radial-gradient(ellipse 90% 55% at 50% 0%,#17202f 0%,transparent 65%)}
button,input,select{font:inherit;color:inherit}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg-grid{position:absolute;left:50%;top:30%;width:260vw;height:150vh;transform:translateX(-50%) perspective(340px) rotateX(64deg);
background-image:linear-gradient(rgba(56,189,248,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.14) 1px,transparent 1px);
background-size:58px 58px;mask-image:radial-gradient(ellipse 52% 62% at 50% 34%,#000 0%,transparent 78%);-webkit-mask-image:radial-gradient(ellipse 52% 62% at 50% 34%,#000 0%,transparent 78%);animation:gridRun 14s linear infinite}
@keyframes gridRun{to{background-position:0 58px,0 0}}
@media(prefers-reduced-motion:reduce){.bg-grid{animation:none}}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0}
.logo{font-family:var(--fd);font-weight:900;font-size:24px;letter-spacing:.06em}
.sp{flex:1}
.chip{border:1px solid var(--line);background:rgba(20,25,34,.8);border-radius:99px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold)}
.notice{margin:6px 0 0;padding:10px 14px;border:1px solid #5c4b1f;background:rgba(255,200,73,.08);color:var(--gold);border-radius:12px;font-size:13px}
.notice.red{border-color:#5c2630;background:rgba(255,59,78,.08);color:#ff9aa5}
.hero{text-align:center;padding:42px 0 26px}
.hero h1{font-family:var(--fd);font-weight:900;font-size:clamp(48px,11vw,96px);letter-spacing:.05em;line-height:1;
background:linear-gradient(170deg,#fff 0%,#8fa4c0 55%,#2d3a4d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-family:var(--fd);font-size:12px;letter-spacing:.45em;color:var(--red);margin-top:12px}
.hero p{color:var(--steel);font-size:14.5px;line-height:1.8;max-width:48ch;margin:16px auto 0}
.box{background:linear-gradient(160deg,var(--panel2),var(--panel) 62%);border:1px solid var(--line);border-radius:20px;padding:20px}
.auth{max-width:380px;margin:0 auto 40px}
.auth h3{font-size:16px;margin-bottom:4px}.auth .d{color:var(--steel);font-size:12px;margin-bottom:14px;line-height:1.6}
.in{width:100%;background:#0d121a;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.in:focus{outline:none;border-color:var(--gold)}
.btn{color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:11px 18px;background:var(--panel2);cursor:pointer;font-weight:700;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--steel)}
.btn.go{background:linear-gradient(180deg,#ff5566,var(--red));border-color:#ff6673;color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}
.btn.w{width:100%}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:12px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:#ff8a95;font-size:12.5px;min-height:18px;margin-top:6px;text-align:center}
.dash{display:grid;grid-template-columns:300px 1fr;gap:16px;margin:10px 0 40px}
@media(max-width:820px){.dash{grid-template-columns:1fr}}
.me .nm{font-size:20px;font-weight:900}
.lv{display:flex;align-items:center;gap:10px;margin-top:10px}
.lv b{font-family:var(--fd);color:var(--gold);font-size:22px}
.xpbar{flex:1;height:8px;background:#0d121a;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8a3c)}
.me .st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;text-align:center}
.me .st div{background:#0f141d;border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:11px;color:var(--steel)}
.me .st b{display:block;color:var(--ink);font-size:16px}
.acts{display:grid;gap:8px;margin-top:14px}
.row{display:flex;gap:8px}
.row .in{margin:0}
h2{font-family:var(--fd);font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:0 0 12px}
.chs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rooms{display:grid;gap:8px}
.rm{display:flex;align-items:center;gap:12px;background:#0f141d;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rm .t{flex:1;min-width:0}.rm .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm .t span{font-size:12px;color:var(--steel)}
.rm .n{font-family:var(--fd);font-size:13px;color:var(--steel)}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--steel);margin-left:6px}
.tag.live{color:var(--green);border-color:#1f5c36}
.empty{color:var(--dim);font-size:13px;padding:22px;text-align:center;border:1px dashed var(--line);border-radius:14px}
dialog{margin:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin-bottom:12px}
dialog label{display:block;font-size:12px;color:var(--steel);margin:4px 0}
.ck{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0 14px}
section{padding:36px 0;border-top:1px solid var(--line)}
.feat{list-style:none;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.feat li{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13px;color:var(--steel);line-height:1.65}
.feat b{color:var(--ink)}
footer{padding:30px 0;border-top:1px solid var(--line);text-align:center;font-size:11.5px;color:var(--dim)}
footer a{color:var(--steel)}
.banned{max-width:420px;margin:60px auto;text-align:center}
.banned b{font-size:22px;color:#ff9aa5}
</style>
</head>
<body>
<div class="bg"><div class="bg-grid"></div></div>
<div class="wrap">
  <div class="top">
    <div class="logo">13</div>
    <span class="sp"></span>
    <button class="chip" id="lang">English</button>
    <button class="chip" id="logout" hidden data-t="logout"></button>
  </div>
  <div id="notices"></div>

  <div id="v-auth" hidden>
    <div class="hero"><h1>13</h1><div class="sub">TACTICAL SHOOTER</div><p data-t="lead"></p></div>
    <div class="box auth">
      <h3 data-t="signin"></h3>
      <div class="d" data-t="signinDesc"></div>
      <input class="in" id="uid" autocomplete="username" maxlength="16">
      <input class="in" id="upw" type="password" autocomplete="current-password" maxlength="64">
      <button class="btn go w" id="doAuth" data-t="signinBtn"></button>
      <div class="or" data-t="or"></div>
      <button class="btn w" id="doGuest" data-t="guestBtn"></button>
      <div class="err" id="aerr"></div>
    </div>
  </div>

  <div id="v-dash" hidden>
    <div class="dash">
      <div>
        <div class="box me">
          <div class="nm" id="meName"></div>
          <div class="lv"><b id="meLv"></b><div class="xpbar"><i id="meXp"></i></div></div>
          <div class="muted" style="font-size:11px;color:var(--dim);margin-top:4px" id="meXpT"></div>
          <div class="st"><div><b id="meK">0</b><span data-t="kills"></span></div><div><b id="meW">0</b><span data-t="wins"></span></div><div><b id="meM">0</b><span data-t="matches"></span></div></div>
          <div class="acts">
            <button class="btn gold" id="mkRoom" data-t="createRoom"></button>
            <a class="btn" href="./play.html" id="solo" data-t="solo"></a>
            <div class="row"><input class="in" id="code" maxlength="6" data-p="codePh"><button class="btn" id="joinCode" data-t="join"></button></div>
          </div>
        </div>
      </div>
      <div class="box">
        <h2 data-t="servers"></h2>
        <div class="chs" id="chs"></div>
        <div class="rooms" id="rooms"></div>
      </div>
    </div>
  </div>

  <div id="v-ban" hidden class="banned box"><b data-t="banned"></b><p id="banWhy" style="color:var(--steel);margin-top:10px"></p></div>

  <section>
    <h2 data-t="about"></h2>
    <ul class="feat" id="feat"></ul>
  </section>
  <footer><a href="./privacy.html" data-t="privacy"></a> · 13</footer>
</div>

<dialog id="dlg">
  <h3 data-t="createRoom"></h3>
  <label data-t="roomName"></label><input class="in" id="rName" maxlength="30">
  <label data-t="server"></label><select class="in" id="rCh"></select>
  <label class="ck"><input type="checkbox" id="rPriv"> <span data-t="private"></span></label>
  <div class="row"><button class="btn" id="rCancel" data-t="cancel"></button><button class="btn gold" id="rGo" style="flex:1" data-t="open"></button></div>
</dialog>

<script>
const API = "/api/v1";
const T = {
  ko: {
    lead: "다섯 명이 한 팀. 요원의 능력으로 각을 열고, 스파이크로 승부를 낸다. 설치 없이 브라우저에서 바로.",
    signin: "로그인", signinDesc: "아이디와 비밀번호를 정해서 넣고 누르면 끝. 처음 쓰는 아이디면 바로 가입됩니다. 인증 없음.",
    idPh: "아이디 (2~16자)", pwPh: "비밀번호 (4자 이상)", signinBtn: "로그인 / 가입", or: "또는", guestBtn: "게스트로 시작",
    logout: "로그아웃", kills: "처치", wins: "승리", matches: "경기", createRoom: "방 만들기", solo: "혼자 연습", join: "참가", codePh: "방 코드 6자리",
    servers: "서버", noRooms: "열린 방이 없습니다. 방을 만들어 보세요.", players: "명", inGame: "경기 중", lobby: "대기", full: "가득 참",
    roomName: "방 이름", server: "서버", private: "비공개 (코드로만 참가)", cancel: "취소", open: "열기",
    banned: "이용이 제한되었습니다", until: "까지", forever: "영구", reason: "사유",
    offline: "지금은 계정 서버에 연결할 수 없습니다. 혼자 연습과 방 코드 참가는 그대로 됩니다.",
    about: "게임", privacy: "개인정보처리방침", guestTag: "게스트", lvNext: (a, b) => `다음 레벨까지 ${b - a} XP`, myRoom: (n) => `${n}의 방`,
    feat: ["<b>5대5 전술전</b> — 일반전·신속전·스파이크 돌격·팀 데스매치·데스매치", "<b>요원 24명</b> — 요원마다 능력 4개, 궁극기 연출", "<b>전장 40곳</b> — 고지대와 계단이 있는 맵 20곳", "<b>총 30종</b> — 전부 다른 모양과 소리", "<b>숨은 치트</b> — 맵 어딘가에 그려진 비밀번호를 찾아라", "<b>모바일</b> — 터치 조작과 앱 설치 지원"],
  },
  en: {
    lead: "Five to a team. Open angles with your agent's abilities and settle it with the spike. No install — right in the browser.",
    signin: "Sign in", signinDesc: "Pick an ID and a password and press the button. A new ID signs you up on the spot. No e-mail, no verification.",
    idPh: "ID (2-16 characters)", pwPh: "Password (4+ characters)", signinBtn: "Sign in / Sign up", or: "or", guestBtn: "Play as guest",
    logout: "Sign out", kills: "Kills", wins: "Wins", matches: "Matches", createRoom: "Create room", solo: "Practice alone", join: "Join", codePh: "6-letter room code",
    servers: "Servers", noRooms: "No open rooms. Create one!", players: "", inGame: "In game", lobby: "Lobby", full: "Full",
    roomName: "Room name", server: "Server", private: "Private (join by code only)", cancel: "Cancel", open: "Open",
    banned: "Your access is restricted", until: "until", forever: "permanently", reason: "Reason",
    offline: "The account server is not reachable right now. Practice and joining by code still work.",
    about: "The game", privacy: "Privacy policy", guestTag: "Guest", lvNext: (a, b) => `${b - a} XP to next level`, myRoom: (n) => `${n}'s room`,
    feat: ["<b>5v5 tactics</b> — Standard, Swift, Spike Rush, Team Deathmatch, Deathmatch", "<b>24 agents</b> — four abilities each, cinematic ultimates", "<b>40 maps</b> — 20 with high ground and stairs", "<b>30 guns</b> — each with its own look and sound", "<b>Hidden cheats</b> — find the code painted somewhere on the map", "<b>Mobile</b> — touch controls, installable app"],
  },
};
let L = localStorage.getItem("lgp_lang") || ((navigator.language || "ko").startsWith("ko") ? "ko" : "en");
try { localStorage.setItem("lgp_lang", L); } catch (e) {}
const t = (k, ...a) => (typeof T[L][k] === "function" ? T[L][k](...a) : T[L][k] ?? k);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function paintLang() {
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach((e) => (e.textContent = t(e.dataset.t)));
  document.querySelectorAll("[data-p]").forEach((e) => (e.placeholder = t(e.dataset.p)));
  $("#uid").placeholder = t("idPh"); $("#upw").placeholder = t("pwPh");
  $("#lang").textContent = L === "ko" ? "English" : "한국어";
  $("#feat").innerHTML = T[L].feat.map((x) => `<li>${x}</li>`).join("");
  CFG && (drawChannels(), drawRooms(), drawMe(), drawNotices());
}
$("#lang").onclick = () => { L = L === "ko" ? "en" : "ko"; localStorage.setItem("lgp_lang", L); paintLang(); };

// a password typed with the Korean keyboard on counts as the keys pressed (박현서 = qkrgustj)
const CHO = "r R s e E f a q Q t T d w W c z x v g".split(" "), JUNG = "k o i O j p u P h hk ho hl y n nj np nl b m ml l".split(" "), JONG = ",r,R,rt,s,sw,sg,e,f,fr,fa,fq,ft,fx,fv,fg,a,q,qt,t,T,d,w,c,z,x,v,g".split(",");
const JAMO = { ㄱ: "r", ㄲ: "R", ㄳ: "rt", ㄴ: "s", ㄵ: "sw", ㄶ: "sg", ㄷ: "e", ㄸ: "E", ㄹ: "f", ㄺ: "fr", ㄻ: "fa", ㄼ: "fq", ㄽ: "ft", ㄾ: "fx", ㄿ: "fv", ㅀ: "fg", ㅁ: "a", ㅂ: "q", ㅃ: "Q", ㅄ: "qt", ㅅ: "t", ㅆ: "T", ㅇ: "d", ㅈ: "w", ㅉ: "W", ㅊ: "c", ㅋ: "z", ㅌ: "x", ㅍ: "v", ㅎ: "g", ㅏ: "k", ㅐ: "o", ㅑ: "i", ㅒ: "O", ㅓ: "j", ㅔ: "p", ㅕ: "u", ㅖ: "P", ㅗ: "h", ㅘ: "hk", ㅙ: "ho", ㅚ: "hl", ㅛ: "y", ㅜ: "n", ㅝ: "nj", ㅞ: "np", ㅟ: "nl", ㅠ: "b", ㅡ: "m", ㅢ: "ml", ㅣ: "l" };
const keysOf = (s) => [...s].map((c) => { const n = c.charCodeAt(0) - 0xac00; if (n >= 0 && n < 11172) return CHO[Math.floor(n / 588)] + JUNG[Math.floor((n % 588) / 28)] + JONG[n % 28]; return JAMO[c] || c; }).join("");
const device = (() => { let d = localStorage.getItem("lgp_device"); if (!d) { d = "d" + crypto.getRandomValues(new Uint32Array(3)).join("").slice(0, 24); localStorage.setItem("lgp_device", d); } return d; })();
let S = null; try { S = JSON.parse(localStorage.getItem("lgp_session") || "null"); } catch (e) {}
let CFG = null, OFFLINE = !1, ROOMS = [], CH = localStorage.getItem("lgp_ch") || "";
async function api(a, b) {
  const r = await fetch(API + "?a=" + a, { method: b ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: b ? JSON.stringify(b) : undefined });
  const j = await r.json().catch(() => ({ ok: !1, error: "offline" }));
  if (!j.ok) throw Object.assign(new Error(j.error || "error"), { status: r.status, ban: j.ban });
  return j;
}
function save(sess) { S = sess; if (sess) { localStorage.setItem("lgp_session", JSON.stringify(sess)); localStorage.setItem("lgp_name", sess.user.id); } else localStorage.removeItem("lgp_session"); }
function view(v) { ["auth", "dash", "ban"].forEach((x) => ($("#v-" + x).hidden = x !== v)); $("#logout").hidden = v !== "dash" || !S; }
function drawNotices() {
  const n = [];
  if (OFFLINE) n.push(`<div class="notice">${esc(t("offline"))}</div>`);
  if (CFG && CFG.game.maintenance) n.push(`<div class="notice red">${esc(CFG.game.maintenanceMsg)}</div>`);
  if (CFG && CFG.game.announcement) n.push(`<div class="notice">📢 ${esc(CFG.game.announcement)}</div>`);
  $("#notices").innerHTML = n.join("");
}
function drawMe() {
  if (!S) return;
  const u = S.user;
  $("#meName").innerHTML = esc(u.id) + (u.guest ? ` <span class="tag">${t("guestTag")}</span>` : "") + (u.admin ? ' <span class="tag" style="color:var(--gold)">ADMIN</span>' : "");
  $("#meLv").textContent = "Lv." + u.level;
  $("#meXp").style.width = Math.round((100 * u.into) / Math.max(1, u.need)) + "%";
  $("#meXpT").textContent = t("lvNext", u.into, u.need);
  $("#meK").textContent = u.kills; $("#meW").textContent = u.wins; $("#meM").textContent = u.matches;
}
const chName = (c) => (L === "en" ? c.en || c.name : c.name);
function drawChannels() {
  const chs = (CFG && CFG.channels) || [];
  if (!chs.some((c) => c.id === CH)) CH = chs[0] ? chs[0].id : "";
  $("#chs").innerHTML = chs.map((c) => `<button class="chip ${c.id === CH ? "on" : ""}" data-ch="${esc(c.id)}">${esc(chName(c))} <span style="color:var(--dim)">${ROOMS.filter((r) => r.ch === c.id).length}</span></button>`).join("");
  $("#rCh").innerHTML = chs.map((c) => `<option value="${esc(c.id)}" ${c.id === CH ? "selected" : ""}>${esc(chName(c))}</option>`).join("");
}
$("#chs").onclick = (e) => { const b = e.target.closest("[data-ch]"); if (!b) return; CH = b.dataset.ch; localStorage.setItem("lgp_ch", CH); drawChannels(); drawRooms(); };
const MODES = { std: ["일반전", "Standard"], swift: ["신속전", "Swift"], rush: ["스파이크 돌격", "Spike Rush"], tdm: ["팀 데스매치", "Team DM"], dm: ["데스매치", "Deathmatch"] };
function drawRooms() {
  const list = ROOMS.filter((r) => r.ch === CH);
  $("#rooms").innerHTML = list.length ? list.map((r) => `<div class="rm"><div class="t"><b>${esc(r.name)}</b><span>${esc(r.host)} · ${esc((MODES[r.mode] || [r.mode, r.mode])[L === "en" ? 1 : 0])}${r.state !== "lobby" ? `<span class="tag live">${t("inGame")}</span>` : `<span class="tag">${t("lobby")}</span>`}</span></div><div class="n">${r.n}/${r.max}</div><button class="btn" data-code="${esc(r.code)}" ${r.n >= r.max ? "disabled" : ""}>${r.n >= r.max ? t("full") : t("join")}</button></div>`).join("") : `<div class="empty">${esc(t("noRooms"))}</div>`;
}
$("#rooms").onclick = (e) => { const b = e.target.closest("[data-code]"); b && go("./play.html?room=" + b.dataset.code); };
const go = (u) => (location.href = u);
$("#joinCode").onclick = () => { const c = $("#code").value.toUpperCase().replace(/[^A-Z0-9]/g, ""); c.length === 6 && go("./play.html?room=" + c); };
$("#mkRoom").onclick = () => { $("#rName").value = t("myRoom", S ? S.user.id : ""); drawChannels(); $("#dlg").showModal(); };
$("#rCancel").onclick = () => $("#dlg").close();
$("#rGo").onclick = () => { const p = new URLSearchParams({ create: "1", rn: $("#rName").value, ch: $("#rCh").value, priv: $("#rPriv").checked ? "1" : "0" }); go("./play.html?" + p); };
$("#logout").onclick = () => { save(null); view("auth"); };
function showBan(b) { view("ban"); $("#banWhy").textContent = (b.reason ? t("reason") + ": " + b.reason + " · " : "") + (b.until ? new Date(b.until).toLocaleString() + " " + t("until") : t("forever")); }
async function auth(guest) {
  $("#aerr").textContent = "";
  try {
    const j = guest ? await api("guest", { device }) : await api("auth", { id: $("#uid").value.trim(), pw: keysOf($("#upw").value), device });
    save({ token: j.token, user: j.user });
    enter();
  } catch (e) {
    if (e.ban) return showBan(e.ban);
    if (guest && (e.status === 503 || e.message === "offline" || e.status === 404)) { save({ token: "", user: { id: localStorage.getItem("lgp_name") || "Guest" + Math.floor(Math.random() * 9000 + 1000), guest: !0, level: 1, into: 0, need: 100, xp: 0, kills: 0, wins: 0, matches: 0 } }); OFFLINE = !0; drawNotices(); return enter(); }
    $("#aerr").textContent = e.message === "offline" ? t("offline") : e.message;
  }
}
$("#doAuth").onclick = () => auth(!1); $("#doGuest").onclick = () => auth(!0);
$("#upw").onkeydown = (e) => { if (e.key === "Enter") auth(!1); };
let roomTimer = null;
async function loadRooms() { try { ROOMS = (await api("rooms")).rooms; } catch (e) { ROOMS = []; } drawChannels(); drawRooms(); }
function enter() { view("dash"); drawMe(); drawChannels(); loadRooms(); clearInterval(roomTimer); roomTimer = setInterval(loadRooms, 6000); }
(async () => {
  paintLang();
  try { CFG = (await api("config")).config; OFFLINE = !1; } catch (e) { OFFLINE = !0; CFG = { game: {}, channels: [] }; }
  drawNotices();
  if (S && S.token) {
    try { const j = await api("me", { token: S.token }); S.user = j.user; save(S); enter(); }
    catch (e) { if (e.ban) showBan(e.ban); else if (e.status === 401) { save(null); view("auth"); } else enter(); }
  } else if (S && OFFLINE) enter();
  else view("auth");
  paintLang();
})();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>
