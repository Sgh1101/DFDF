<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>13</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="description" content="5대5 전술 FPS · 5v5 tactical shooter in the browser">
<meta property="og:title" content="13">
<meta property="og:description" content="브라우저에서 바로 하는 5대5 전술 교전 · 5v5 tactical shooter, right in the browser">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--void:#0a0d12;--panel:#141922;--panel2:#1b222e;--line:#2a3444;--steel:#8a97ab;--dim:#5b6879;--ink:#e8edf4;--red:#ff3b4e;--gold:#ffc849;--cyan:#22d3ee;--green:#4ade80;
--fd:'Jua',system-ui,sans-serif;--fb:'Gowun Dodum',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;min-height:100vh;
background-image:radial-gradient(ellipse 90% 55% at 50% 0%,#17202f 0%,transparent 65%)}
button,input,select{font:inherit;color:inherit}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg-grid{position:absolute;left:50%;top:30%;width:260vw;height:150vh;transform:translateX(-50%) perspective(340px) rotateX(64deg);
background-image:linear-gradient(rgba(56,189,248,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.14) 1px,transparent 1px);
background-size:58px 58px;mask-image:radial-gradient(ellipse 52% 62% at 50% 34%,#000 0%,transparent 78%);-webkit-mask-image:radial-gradient(ellipse 52% 62% at 50% 34%,#000 0%,transparent 78%);animation:gridRun 14s linear infinite}
@keyframes gridRun{to{background-position:0 58px,0 0}}
@media(prefers-reduced-motion:reduce){.bg-grid{animation:none}}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0}
.logo{font-family:var(--fd);font-weight:900;font-size:24px;letter-spacing:.06em}
.sp{flex:1}
.chip{border:1px solid var(--line);background:rgba(20,25,34,.8);border-radius:99px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold)}
.notice{margin:6px 0 0;padding:10px 14px;border:1px solid #5c4b1f;background:rgba(255,200,73,.08);color:var(--gold);border-radius:12px;font-size:13px}
.notice.red{border-color:#5c2630;background:rgba(255,59,78,.08);color:#ff9aa5}
.hero{text-align:center;padding:42px 0 26px}
.hero h1{font-family:var(--fd);font-weight:900;font-size:clamp(48px,11vw,96px);letter-spacing:.05em;line-height:1;
background:linear-gradient(170deg,#fff 0%,#8fa4c0 55%,#2d3a4d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-family:var(--fd);font-size:12px;letter-spacing:.45em;color:var(--red);margin-top:12px}
.hero p{color:var(--steel);font-size:14.5px;line-height:1.8;max-width:48ch;margin:16px auto 0}
.box{background:linear-gradient(160deg,var(--panel2),var(--panel) 62%);border:1px solid var(--line);border-radius:20px;padding:20px}
.auth{max-width:380px;margin:0 auto 40px}
.auth h3{font-size:16px;margin-bottom:4px}.auth .d{color:var(--steel);font-size:12px;margin-bottom:14px;line-height:1.6}
.in{width:100%;background:#0d121a;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.in:focus{outline:none;border-color:var(--gold)}
.btn{color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:11px 18px;background:var(--panel2);cursor:pointer;font-weight:700;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--steel)}
.btn.go{background:linear-gradient(180deg,#ff5566,var(--red));border-color:#ff6673;color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}
.btn.w{width:100%}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:12px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:#ff8a95;font-size:12.5px;min-height:18px;margin-top:6px;text-align:center}
.card{max-width:440px;margin:0 auto 40px;padding:24px 22px 20px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 55% at 18% 0%,rgba(255,200,73,.13),transparent 70%);pointer-events:none}
.pf{display:flex;align-items:center;gap:18px;position:relative}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:#0d121a}
.ring .fg{stroke:url(#xpg);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.3,1)}
.lvl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lvl small{font-family:var(--fd);font-size:10px;letter-spacing:.3em;color:var(--steel);margin-left:.3em}
.lvl b{font-family:var(--fd);font-size:34px;font-weight:900;color:var(--gold);margin-top:2px}
.who{min-width:0;flex:1}
.nm{font-size:21px;font-weight:900;word-break:break-all;line-height:1.3}
.rank{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:99px;border:1px solid #5c4b1f;color:var(--gold);background:rgba(255,200,73,.07)}
.xpt{margin-top:8px;font-size:12px;color:var(--steel)}
.xpbar{height:6px;margin-top:6px;background:#0d121a;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff8a3c);transition:width 1s cubic-bezier(.2,.7,.3,1)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px;text-align:center}
.st div{background:#0f141d;border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:11px;color:var(--steel)}
.st b{display:block;color:var(--ink);font-size:18px;font-family:var(--fd);margin-bottom:2px}
.tier{--tc:#8a8f98;display:flex;align-items:center;gap:12px;margin:12px auto 0;padding:9px 16px 9px 10px;border:1px solid color-mix(in srgb,var(--tc) 40%,var(--line));border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 16%,transparent),transparent 80%);width:max-content;max-width:100%}
.tier[hidden]{display:none}
.tier .tb svg{width:48px;height:48px;display:block;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--tc) 55%,transparent))}
.tier b{font-family:var(--fd);color:var(--tc);font-size:16px;letter-spacing:.03em}
.tbar{height:6px;border-radius:3px;background:#1d2533;margin:5px 0 3px;overflow:hidden;width:170px}
.tbar i{display:block;height:100%;background:var(--tc);border-radius:3px}
.tier small{color:var(--steel);font-size:11px}
.ttl{margin-top:2px;font:700 12px/1.3 var(--fd);letter-spacing:.08em}
.card.has-card{background-blend-mode:normal}
.tier .ssn{display:block;margin-top:2px;color:var(--tc);opacity:.9}
.tier .ssn[hidden]{display:none}
.tier.ai{margin-top:8px;padding:6px 14px 6px 8px}.tier.ai .tb svg{width:34px;height:34px}.tier.ai b{font-size:14px}.tier.ai small{display:block;margin-top:1px}
.ssn-end{display:flex;align-items:center;gap:10px;margin:12px auto 0;max-width:100%;width:max-content;padding:9px 12px 9px 14px;border-radius:14px;border:1px solid rgba(255,200,73,.45);background:linear-gradient(90deg,rgba(255,200,73,.14),rgba(255,200,73,.03));color:var(--steel);font-size:12px;line-height:1.45}
.ssn-end[hidden]{display:none}
.ssn-end b{color:var(--gold)}
.ssn-end button{flex:none;border:1px solid rgba(255,200,73,.5);background:transparent;color:var(--gold);border-radius:99px;padding:4px 10px;font:inherit;font-size:11px;cursor:pointer}
.hr .res .rr{display:block;font-size:10px;font-family:var(--fd)}
.hr .res .rr.up{color:var(--green,#4ade80)}.hr .res .rr.dn{color:#ff6b7a}
.wallet{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:12px;color:var(--steel)}
.wallet span{padding:5px 12px;border:1px solid var(--line);border-radius:999px}
.wallet .g{color:var(--gold);border-color:#5c4b1f;font-family:var(--fd)}
.wallet a{padding:5px 12px;border:1px solid #5c4b1f;border-radius:999px;color:var(--gold);text-decoration:none;font-weight:700;background:rgba(255,200,73,.06)}
.wallet a:hover{background:rgba(255,200,73,.14)}
.hist{max-width:720px;margin:-18px auto 40px}
.hist h3{font-family:var(--fd);font-size:12px;letter-spacing:.18em;color:var(--steel-dim);margin:0 0 10px 4px;text-transform:uppercase}
.hr{display:grid;grid-template-columns:92px minmax(0,1.6fr) minmax(0,1fr) 64px;gap:10px;align-items:center;padding:10px 12px;margin-bottom:6px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--steel-dim);background:var(--panel)}
.hr.win{border-left-color:var(--green);background:linear-gradient(90deg,rgba(74,222,128,.1),var(--panel) 60%)}
.hr.loss{border-left-color:var(--red);background:linear-gradient(90deg,rgba(255,59,78,.1),var(--panel) 60%)}
.hr b{display:block;font-family:var(--fd);font-size:14px}
.hr small,.hr span{display:block;font-size:11px;color:var(--steel)}
.hr .res b{font-size:15px}.hr.win .res b{color:var(--green)}.hr.loss .res b{color:var(--red)}
.hr .mid b{font-family:var(--fb,inherit);font-size:13px;font-weight:700}
.hr .mvp{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;border:1px solid #5c4b1f;color:var(--gold);font-size:9px;letter-spacing:.1em;font-family:var(--fd)}
.mast{max-width:720px;margin:6px auto 28px}
.mast h3{font-family:var(--fd);font-size:12px;letter-spacing:.18em;color:var(--steel-dim);margin:0 0 10px 4px;text-transform:uppercase}
.mr{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1.3fr) auto;gap:6px 12px;align-items:center;padding:8px 12px;margin-bottom:5px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.mr .mn b{display:block;font-size:13.5px}.mr .mn small{font-size:10.5px;color:var(--steel)}
.mr .mb2 i{display:block;height:5px;border-radius:99px;background:#0d121a;border:1px solid var(--line);overflow:hidden}.mr .mb2 i u{display:block;height:100%;background:var(--mc,#8a97ab);text-decoration:none}
.mr .mb2 small{display:block;margin-top:3px;font-size:10.5px;color:var(--steel)}
.mr .mw{font-size:11px;color:var(--steel);text-align:right;white-space:nowrap}
.pr{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 12px;margin-bottom:5px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.pr .pb{height:30px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--fd);background:#0d121a;border:1px solid var(--line);color:var(--steel);white-space:nowrap}
.pr .pn{min-width:0}.pr .pn b{display:block;font-size:13.5px}.pr .pn small{display:block;font-size:10.5px;color:var(--steel)}
.pr .pn i{display:block;height:5px;margin-top:5px;border-radius:99px;background:#0d121a;border:1px solid var(--line);overflow:hidden}.pr .pn i u{display:block;height:100%;background:var(--gold);text-decoration:none}
.pr .pw{font-size:11px;color:var(--steel);text-align:right;white-space:nowrap}.pr .pw b{display:block;color:var(--gold);font-size:12px}
.pr.on{border-color:#5c4b1f;background:linear-gradient(90deg,rgba(255,200,73,.08),transparent 60%),var(--panel)}.pr.on .pb{color:var(--gold);border-color:#5c4b1f}
.pr.next{border-style:dashed}.prn{margin:0 4px 8px;font-size:11.5px;color:var(--steel)}
.mast .more{display:block;width:100%;margin-top:4px;padding:8px;border-radius:12px;border:1px dashed var(--line);background:none;color:var(--steel);font-size:12px;cursor:pointer}
.mast .more:hover{border-color:var(--steel);color:var(--ink)}
.mast .empty{padding:14px;text-align:center;color:var(--steel-dim);font-size:12px;border:1px dashed var(--line);border-radius:12px}
@media(max-width:600px){.mr{grid-template-columns:34px minmax(0,1fr) auto;gap:4px 10px}.mr .mb2{grid-column:2 / 4;grid-row:2}}
.hist .empty{padding:14px;text-align:center;color:var(--steel-dim);font-size:12px;border:1px dashed var(--line);border-radius:12px}
@media(max-width:600px){.hr{grid-template-columns:76px minmax(0,1.4fr) minmax(0,1fr);gap:8px;padding:9px 10px}.hr .cs{display:none}.hr b{font-size:12.5px}}
.inv{margin-top:14px;padding:10px 14px;border-radius:12px;border:1px solid #1f5c36;background:rgba(74,222,128,.07);color:var(--green);font-size:13px;text-align:center}
.inv b{font-family:var(--fd);letter-spacing:.18em;margin-left:6px}
.enter{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;padding:17px;border-radius:14px;font-size:17px;font-weight:900;letter-spacing:.04em;color:#fff;text-decoration:none;
background:linear-gradient(180deg,#ff5b6b,#e0303f);border:1px solid rgba(255,140,150,.6);box-shadow:0 16px 36px -14px rgba(255,59,78,.9),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,filter .15s}
.enter:hover{filter:brightness(1.07);transform:translateY(-1px)}
.enter:active{transform:translateY(1px)}
.enter i{font-style:normal;font-size:24px;line-height:1;margin-top:-2px}
.hint{margin-top:10px;text-align:center;font-size:12px;color:var(--dim)}
.skip{display:block;margin-top:8px;text-align:center;font-size:12px;color:var(--steel)}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--steel);margin-left:6px;vertical-align:middle;text-decoration:none}
@media(max-width:420px){.pf{gap:14px}.ring{width:88px;height:88px}.lvl b{font-size:28px}.st{grid-template-columns:repeat(2,1fr)}}
@media(max-height:560px){.hero{padding:16px 0 12px}.hero h1{font-size:52px}.hero p{display:none}.card{padding:16px 18px 14px}}
@media(max-height:560px) and (min-width:640px){
  .top{padding:8px 0}
  .stage{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:24px;align-items:center;min-height:calc(100vh - 52px);padding-bottom:12px}
  .hero{text-align:left;padding:0}
  .hero h1{font-size:clamp(56px,10vh,84px)}
  .hero .sub{letter-spacing:.32em;margin-top:8px}
  .auth,.card{margin:0;max-width:none}
  .auth .d{display:none}
  .auth h3{margin-bottom:10px}
  .in{padding:10px 12px;margin-bottom:8px}
  .or{margin:8px 0}
  .card{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.62fr);gap:16px;align-items:center;padding:16px}
  .ring{width:76px;height:76px}.lvl b{font-size:24px}.lvl small{font-size:8px}
  .pf{gap:12px}.nm{font-size:17px}.rank{margin-top:3px}.xpt{margin-top:5px}
  .st{grid-template-columns:repeat(4,1fr);margin-top:12px;gap:5px}.st div{padding:7px 2px}.st b{font-size:15px}
  .inv{margin:0 0 10px;padding:8px;font-size:12px}
  .enter{margin:0;padding:22px 10px;font-size:16px}
  .wallet{flex-wrap:wrap;gap:4px;margin-top:8px;font-size:11px}.wallet span,.wallet a{padding:4px 6px;white-space:nowrap}
  .hint{font-size:11px}
  section{padding-top:24px}
}
/* a desktop window: the title on the left, the profile card with the way in on the right (the column of 440 px
   left the button below the fold at 1280 x 720); phones and short landscape windows keep their own rules */
@media(min-width:1000px) and (min-height:600px){
  .wrap{max-width:1160px;padding:0 32px}
  .top{padding:20px 0}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:72px;align-items:center;min-height:calc(100vh - 140px);padding-bottom:24px}
  .hero{text-align:left;padding:0}
  .hero h1{font-size:clamp(120px,15vw,200px);letter-spacing:.04em}
  .hero .sub{margin-top:18px;font-size:13px;letter-spacing:.5em}
  .hero p{margin:24px 0 0;max-width:38ch;font-size:16px;line-height:1.9}
  .auth,.card{margin:0;max-width:none}
  .views .hist{max-width:none;margin:24px 0 0}
}
[hidden]{display:none!important}
h2{font-family:var(--fd);font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:0 0 12px}
section{padding:36px 0;border-top:1px solid var(--line)}
.feat{list-style:none;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.feat li{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13px;color:var(--steel);line-height:1.65}
.feat b{color:var(--ink)}
footer{padding:30px 0;border-top:1px solid var(--line);text-align:center;font-size:11.5px;color:var(--dim)}
footer a{color:var(--steel);display:inline-flex;align-items:center;min-height:36px;padding:4px 2px;vertical-align:middle}
@media(pointer:coarse){.wallet a{display:inline-flex;align-items:center;min-height:36px;box-sizing:border-box}}
.banned{max-width:420px;margin:60px auto;text-align:center}
.banned b{font-size:22px;color:#ff9aa5}
</style>
<script src="./js/client-request.js"></script>
<script src="./js/feedback.js"></script>
<script src="./js/promo.js"></script>
<script src="./js/notice-popup.js"></script>
<script src="./js/order.js"></script>
<script src="./js/cosmetics.js"></script>
<script src="./js/agent-mastery.js"></script>
<script src="./js/progression-text.js"></script>
</head>
<body>
<div class="bg"><div class="bg-grid"></div></div>
<div class="wrap">
  <div class="top">
    <div class="logo">13</div>
    <span class="sp"></span>
    <button class="chip" id="orderOpen" data-t="order" type="button" hidden></button>
    <button class="chip" id="fbOpen" data-t="feedback" type="button"></button>
    <button class="chip" id="lang">English</button>
    <button class="chip" id="logout" hidden data-t="logout"></button>
  </div>
  <div id="notices"></div>

  <div class="stage">
  <div class="hero" id="hero"><h1>13</h1><div class="sub">TACTICAL SHOOTER</div><p data-t="lead"></p></div>
  <div class="views">
  <div id="v-auth" hidden>
    <div class="box auth">
      <h3 data-t="signin"></h3>
      <div class="d" data-t="signinDesc"></div>
      <input class="in" id="uid" autocomplete="username" maxlength="16">
      <input class="in" id="upw" type="password" autocomplete="current-password" maxlength="64">
      <button class="btn go w" id="doAuth" data-t="signinBtn"></button>
      <div class="or" data-t="or"></div>
      <button class="btn w" id="doGuest" data-t="guestBtn"></button>
      <div class="err" id="aerr"></div>
    </div>
  </div>

  <div id="v-dash" hidden>
    <div class="box card">
      <div class="me">
      <div class="pf">
        <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="xpg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc849"/><stop offset="1" stop-color="#ff8a3c"/></linearGradient></defs><circle class="bgc" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
          <div class="lvl"><small>LV</small><b id="meLv">1</b></div></div>
        <div class="who">
          <div class="nm" id="meName"></div>
          <div class="ttl" id="meTitle" hidden></div>
          <span class="rank" id="meRank"></span>
          <div class="xpbar"><i id="meXp"></i></div>
          <div class="xpt" id="meXpT"></div>
        </div>
      </div>
      <div class="tier" id="meTier" hidden><div class="tb" id="meTierB"></div><div class="ti"><b id="meTierN"></b><div class="tbar"><i id="meTierX"></i></div><small id="meTierT"></small><small class="ssn" id="meSeason"></small></div></div>

    $("#meTierB").innerHTML = rk.hidden ? '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 2l19 10.5v23L24 46 5 35.5v-23z" fill="#1b222e" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 2"/><text x="24" y="31" text-anchor="middle" font-size="22" font-weight="800" fill="#c9d3de" font-family="sans-serif">?</text></svg>' : tierBadge(rk.t, rk.div);
    $("#meTierN").textContent = rk.hidden ? t("placingName") + " " + pl.done + "/" + pl.of : T[L].tiers[rk.t] + (rk.div ? " " + rk.div : "");
    $("#meTierX").style.width = rk.hidden ? Math.max(2, (100 * pl.done) / pl.of) + "%" : (rk.t >= 8 ? 100 : Math.max(2, rk.into)) + "%";
    $("#meTierT").textContent = rk.hidden ? t("placing", pl.done, pl.of) : rk.t >= 8 ? t("rrTop", rk.rr) : t("rrNext", rk.into);
  }
  // the AI competitive rating (a number of its own, from solo matches): the tier and the record, never the real rank
  const ai = !u.guest && u.ai;
  $("#meAi").hidden = !ai;
  if (ai) {
    const nm = (r) => T[L].tiers[r.t] + (r.div ? " " + r.div : ""), at = (rr) => (rr >= 2400 ? { t: 8, div: 0 } : { t: Math.floor(rr / 300), div: (Math.floor(rr / 100) % 3) + 1 });
    $("#meAi").style.setProperty("--tc", TIER_C[ai.t] || "#8a8f98");
    $("#meAiB").innerHTML = tierBadge(ai.t, ai.div, "ag");
    $("#meAiN").textContent = nm(ai);
    $("#meAiT").textContent = t("aiTier") + " · " + (ai.played ? t("aiRec", ai.played, ai.w, nm(at(ai.best))) : t("aiNone"));
  }
  // the season: how long is left, what ended last (told once)
  const ss = !u.guest && u.season;
  $("#meSeason").hidden = !ss;
  if (ss) $("#meSeason").textContent = t("season", ss.n, Math.max(1, Math.ceil((ss.end - Date.now()) / 864e5)), ss.played || 0, ss.need || 0);
  const last = ss && ss.last;
  let seen = 0;
  try { seen = +localStorage.getItem("lgp_ssn_seen") || 0; } catch (e) {}
  $("#ssnEnd").hidden = !(last && last.n > seen);
  if (last && last.n > seen) {
    $("#ssnEndT").innerHTML = t("seasonEnd", last.n, T[L].tiers[last.t] + (last.div ? " " + last.div : ""), last.gold || 0, last.skin || 0, last.after || 0);
    $("#ssnEndOk").textContent = t("seasonOk");
    $("#ssnEndOk").onclick = () => { try { localStorage.setItem("lgp_ssn_seen", String(last.n)); } catch (e) {} $("#ssnEnd").hidden = true; };
  }
  drawMast();
  drawProg();
  drawHist();
}
// a tier badge: a gem in the tier's colour, more points the higher, a pip a division
const TIER_C = ["#8a8f98", "#c07a4a", "#c9d3de", "#ffc849", "#3fd0c9", "#b48cff", "#3ddc84", "#ff4d6d", "#fff3a0"];
function tierBadge(t, div, pre) {
  const c = TIER_C[t] || TIER_C[0], n = t >= 8 ? 8 : 4 + Math.floor(t / 2), id = (pre || "tg") + t;
  let star = "";
  for (let i = 0; i < 2 * n; i++) { const a = -Math.PI / 2 + (i * Math.PI) / n, r = i % 2 ? 5 : 11 + (t >= 8 ? 3 : 0); star += (i ? "L" : "M") + (24 + r * Math.cos(a)).toFixed(1) + " " + (22 + r * Math.sin(a)).toFixed(1); }
  let pips = "";
  for (let i = 0; i < (div || 0); i++) { const x = 24 + (i - (div - 1) / 2) * 7; pips += `<path d="M${x} 33l2.6 2.6-2.6 2.6-2.6-2.6z" fill="#fff" opacity=".9"/>`; }
  return `<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="${c}"/><stop offset="1" stop-color="#0c1018"/></linearGradient></defs><path d="M24 2l19 10.5v23L24 46 5 35.5v-23z" fill="url(#${id})" stroke="${c}" stroke-width="1.5"/><path d="M24 7l15 8.3v17.4L24 41 9 32.7V15.3z" fill="#0c1018" opacity=".45"/><path d="${star}Z" fill="${c}" stroke="#fff" stroke-opacity=".6" stroke-width=".8"/>${pips}</svg>`;
}
// the agents the account has played, best first: a hexagon with the level, the way to the next one, matches and wins
// (the server counts it; the agent names are the game's roster file)
let ROSTER = null, MAST_ALL = !1;
fetch("./js/agent-roster.json").then((r) => r.json()).then((j) => { ROSTER = j; S && drawMast(); }).catch(() => { ROSTER = []; });
function drawMast() {
  const box = $("#mast"), u = S && S.user, off = CFG && CFG.mastery && CFG.mastery.on === !1;
  box.hidden = !u || typeof u.gold !== "number" || off || $("#v-dash").hidden;
  if (box.hidden) return;
  const mast = (u.mast && typeof u.mast === "object" && u.mast) || {}, by = Object.fromEntries((ROSTER || []).map((a) => [a.id, a]));
  const rows = Object.keys(mast).filter((id) => mast[id] && typeof mast[id] === "object").sort((a, b) => (mast[b].xp | 0) - (mast[a].xp | 0) || (a < b ? -1 : 1));
  const row = (id) => {
    const m = mast[id], a = by[id] || { name: id, role: "" }, lv = m.lv | 0 || 1, c = MASTERY.color(lv), pct = m.need ? Math.round(100 * Math.min(1, (m.into | 0) / m.need)) : 100;
    return `<div class="mr" data-agent="${esc(id)}" style="--mc:${c}"><span>${MASTERY.badge(lv, 15)}</span><div class="mn"><b>${esc(a.name)}</b><small>${esc((T[L].roles || {})[a.role] || a.role || "")}</small></div><div class="mb2"><i><u style="width:${pct}%"></u></i><small>${m.need ? `${m.into | 0} / ${m.need} XP` : esc(t("mastMax"))}</small></div><div class="mw">${esc(t("mastRec", m.m | 0, m.w | 0))}</div></div>`;
  };
  const shown = MAST_ALL ? rows : rows.slice(0, 5);
  $("#mastList").innerHTML = rows.length ? shown.map(row).join("") + (rows.length > 5 ? `<button type="button" class="more" id="mastMore">${esc(MAST_ALL ? t("mastLess") : t("mastMore", rows.length))}</button>` : "") : `<div class="empty">${esc(t("mastEmpty"))}</div>`;
  const more = $("#mastMore");
  more && (more.onclick = () => { MAST_ALL = !MAST_ALL; drawMast(); });
}
// level rewards and achievements. The server pays them (only for a match with a valid ticket); the numbers here are the
// owner's, from the public config, and the account's own progress, from its user
function drawProg() {
  const u = S && S.user, R = CFG && CFG.rewards, shown = !!u && typeof u.gold === "number" && !!R && !$("#v-dash").hidden;
  const lv = shown && R.lv && R.lv.on, fw = shown && R.firstWin && R.firstWin.on, ach = shown && R.ach && R.ach.on && Array.isArray(u.ach) && u.ach.length;
  $("#lvr").hidden = !(lv || fw); $("#ach").hidden = !ach;
  if (lv || fw) {
    const lvl = u.level || 1, cos = (id) => { const x = window.COSMETICS && COSMETICS.by[id]; return x ? COSMETICS.slotName(x.s) + " · " + COSMETICS.name(x) : ""; };
    const rows = [];
    if (fw) rows.push(`<div class="pr ${u.fw ? "" : "on"}" id="fwRow"><span class="pb">1st</span><div class="pn"><b>${esc(t("fwName"))}</b><small>${esc(R.firstWin.gold ? "🪙 " + R.firstWin.gold : "")}${R.firstWin.gold && R.firstWin.xp ? " · " : ""}${esc(R.firstWin.xp ? R.firstWin.xp + " XP" : "")}</small></div><div class="pw">${esc(t(u.fw ? "fwDone" : "fwReady"))}</div></div>`);
    if (lv) {
      const ms = R.lv.ms || [], gap = ms.find((m) => m.lv > lvl);
      rows.push(`<div class="prn">${esc(t("lvEach", R.lv.gold))}</div>`);
      for (const m of ms) {
        const got = lvl >= m.lv;
        rows.push(`<div class="pr ${got ? "on" : gap === m ? "next" : ""}" data-lv="${m.lv}"><span class="pb">Lv ${m.lv}</span><div class="pn"><b>${esc(m.cos ? cos(m.cos) : "🪙")}</b><small>${esc("🪙 " + (R.lv.gold + R.lv.milestoneGold))}</small></div><div class="pw">${esc(got ? t("lvReached") : t("lvGap", m.lv - lvl))}</div></div>`);
      }
    }
    $("#lvrList").innerHTML = rows.join("");
  }
  if (ach) {
    $("#achList").innerHTML = u.ach.map((a) => {
      const w = window.PROGRESSION ? PROGRESSION.ach(a.id) : { name: a.id, desc: "" }, done = !!a.got, pct = Math.round(100 * Math.min(1, (a.have | 0) / Math.max(1, a.n)));
      return `<div class="pr ${done ? "on" : ""}" data-ach="${esc(a.id)}"><span class="pb">${done ? "✓" : a.have + "/" + a.n}</span><div class="pn"><b>${esc(w.name)}</b><small>${esc(w.desc)}</small>${done ? "" : `<i><u style="width:${pct}%"></u></i>`}</div><div class="pw"><b>🪙 ${a.gold}</b>${done ? esc(t("achDone")) : ""}</div></div>`;
    }).join("");
  }
}
// the modes without sides (the same list the server reads, js/game-rules.js): they show the placing and the kills
const FFA = ["dm", "knife", "gun", "zone", "range"];
// the last matches, newest first (the game sends a summary with each report)
function drawHist() {
  const h = $("#hist"), list = (S && S.hist) || [];
  h.hidden = !S || !S.user || typeof S.user.gold !== "number";
  if (h.hidden) return;
  const when = (ms) => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  $("#histList").innerHTML = list.length ? list.map((m) => {
    const ffa = FFA.includes(m.mode), draw = !ffa && m.s && m.s[0] === m.s[1];
    const res = ffa ? t("place", m.rank || 1) : draw ? t("draw") : m.win ? t("win") : t("loss");
    const sc = ffa ? t("kills1", m.k || 0) : `${m.s ? m.s[0] : 0} - ${m.s ? m.s[1] : 0}`;
    const rr = typeof m.rr === "number" && m.rr ? `<small class="rr ${m.rr > 0 ? "up" : "dn"}">${m.rr > 0 ? "+" : ""}${m.rr} RR</small>` : "";
    return `<div class="hr ${m.win ? "win" : draw ? "" : "loss"}"><div class="res"><b>${esc(res)}</b><span>${esc(sc)}</span>${rr}</div>
      <div class="mid"><b>${esc(T[L].modes[m.mode] || m.mode)}${m.map ? " · " + esc(m.map) : ""}${m.mvp ? '<i class="mvp">MVP</i>' : ""}</b><small>${esc(m.agent || "")}${m.agent ? " · " : ""}${when(m.t)}</small></div>
      <div class="kda"><b>${m.k | 0} / ${m.d | 0} / ${m.a | 0}</b><small>K / D / A</small></div>
      <div class="cs"><b>${m.cs | 0}</b><small>${esc(t("score"))}</small></div></div>`;
  }).join("") : `<div class="empty">${esc(t("noHist"))}</div>`;
}
function drawEnter() {
  $("#enter").href = gameUrl(ROOM);
  $("#enterT").textContent = ROOM ? t("joinInvite", ROOM) : t("enter");
  $("#inv").hidden = !ROOM; $("#inv").innerHTML = ROOM ? `${esc(t("invited"))}<b>${esc(ROOM)}</b>` : "";
  $("#skip").hidden = !ROOM; $("#skip").href = gameUrl("");
  $("#hint").hidden = !!ROOM;
}
$("#logout").onclick = () => { save(null); view("auth"); };
addEventListener("storage", (e) => { if (e.key !== "lgp_session") return; const next = JSON.parse(e.newValue || "null"); if (!next || next.token !== (S && S.token)) { S = null; sessionStorage.removeItem("lgp_gate"); view("auth"); } else { S = next; if (gatePassed()) enter(); } });
function showBan(b) { view("ban"); $("#banWhy").textContent = (b.reason ? t("reason") + ": " + b.reason + " · " : "") + (b.until ? new Date(b.until).toLocaleString() + " " + t("until") : t("forever")); }
async function auth(guest) {
  $("#aerr").textContent = "";
  $("#doAuth").disabled = $("#doGuest").disabled = !0;
  try {
    const j = guest ? await api("guest", { device }) : await api("auth", { id: $("#uid").value.trim(), pw: keysOf($("#upw").value), device });
    save({ token: j.token, user: j.user, atoken: j.atoken || "", hist: j.hist || [] });
    try { sessionStorage.setItem("lgp_gate", j.token); } catch (e) {}
    enter();
  } catch (e) {
    if (e.ban) return showBan(e.ban);
    if (guest && (e.network || e.status === 404)) {
      // the account server is down: a guest still gets into the game (no level, no list)
      save({ token: "", user: { id: localStorage.getItem("lgp_name") || "Guest" + Math.floor(Math.random() * 9000 + 1000), guest: !0, level: 1, into: 0, need: 100, xp: 0, kills: 0, wins: 0, matches: 0 } });
      try { sessionStorage.setItem("lgp_gate", "offline"); } catch (x) {}
      OFFLINE = !0; drawNotices(); return enter();
    }
    $("#aerr").textContent = e.message === "offline" ? t("offline") : e.message;
  } finally { $("#doAuth").disabled = $("#doGuest").disabled = !1; }
}
$("#doAuth").onclick = () => auth(!1); $("#doGuest").onclick = () => auth(!0);
$("#upw").onkeydown = (e) => { if (e.key === "Enter") auth(!1); };
$("#uid").onkeydown = (e) => { if (e.key === "Enter") $("#upw").focus(); };
// the feature list; its map line also names the map of the week while the server has one (js/map-week.js)
function drawFeat() { $("#feat").innerHTML = T[L].feat.map((x) => `<li>${x.replace("{wk}", CFG && CFG.weekMap ? T[L].featWeek : "")}</li>`).join(""); }
// the announcement and the promo film come up in the middle once, right after signing in (js/notice-popup.js)
function enter() { view("dash"); drawMe(); drawEnter(); window.NOTICE && NOTICE.auto(); }
(async () => {
  paintLang();
  try { CFG = (await api("config")).config; OFFLINE = !1; } catch (e) { OFFLINE = !0; CFG = { game: {}, channels: [] }; }
  window.NOTICE && NOTICE.configure(CFG.game);
  drawNotices(); drawFeat();
  const offlineGuest = (() => { try { return !!S && !S.token && sessionStorage.getItem("lgp_gate") === "offline"; } catch (e) { return !1; } })();
  if (S && S.token && !gatePassed()) {
    // ask again; the last id is filled in
    view("auth");
    try { $("#uid").value = S.user && !S.user.guest ? S.user.id : localStorage.getItem("lgp_name") || ""; $("#uid").value && $("#upw").focus(); } catch (e) {}
  } else if (S && S.token) {
    try { const j = await api("me", { token: S.token }); S.user = j.user; S.atoken = j.atoken || ""; S.hist = j.hist || S.hist || []; save(S); enter(); }
    catch (e) { if (e.ban) showBan(e.ban); else if (e.status === 401) { save(null); view("auth"); } else enter(); }
  } else if (offlineGuest) enter();
  else view("auth");
  paintLang();
})();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
